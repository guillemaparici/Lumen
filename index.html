/* 2. TOKENS --------------------------------------------------------------- */
:root{
  /* Superficies */
  --bg:#0a0a0a;
  --bg-2:#121212;
  /* Texto: blanco roto, nunca blanco puro */
  --text:#f5f5f7;
  --muted:#a1a1a6;
  --dim:#6e6e73;
  --ink:#0a0a0a;                       /* texto sobre fondos claros */
  /* Líneas y brillos */
  --hair:rgba(255,255,255,.09);
  --hair-2:rgba(255,255,255,.16);
  --glow:rgba(245,245,247,.16);
  /* Relleno claro (botón principal, chip activo) */
  --light:linear-gradient(180deg,#fbfbfd 0%,#dcdce0 100%);
  /* Tipografía */
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Movimiento */
  --ease:cubic-bezier(.22,1,.36,1);    /* salida suave */
  --ease-io:cubic-bezier(.65,0,.35,1);
  /* Medidas */
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --tb-top:10px;                       /* separación de la barra superior */
  --tb-h:56px;                         /* altura de la barra superior */
}

/* 3. BASE ----------------------------------------------------------------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 var(--sans);font-weight:420;letter-spacing:.005em;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;color-scheme:dark}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid rgba(245,245,247,.75);outline-offset:3px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* 4. CRISTAL Y BORDE FINO -------------------------------------------------
   Cristal: fondo translúcido + desenfoque del contenido que hay detrás.
   Borde:   1px con degradado (más luz arriba), dibujado con una máscara. */
#topbar,#dock,#toast,#badge,#sheet .card,#dlg .card{
  background:linear-gradient(180deg,rgba(42,42,45,.56) 0%,rgba(16,16,18,.68) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.07) inset,       /* filo de luz superior */
    0 1px 2px rgba(0,0,0,.45),                 /* contacto */
    0 10px 28px rgba(0,0,0,.34),               /* sombra media */
    0 30px 70px rgba(0,0,0,.40);               /* ambiente */
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #topbar,#dock,#toast,#badge,#sheet .card,#dlg .card{background:linear-gradient(180deg,#232325,#121213)}
}
:is(.ibtn,.btn,.chip,.pill,.seg,#tools){position:relative}
:is(#topbar,#dock,#toast,#badge,#sheet .card,#dlg .card,.ibtn,.btn,.chip,.pill,.seg,#tools)::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,.10) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  transition:opacity .3s var(--ease)
}

/* 5. LAYOUT --------------------------------------------------------------- */
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* Escenario: la foto ocupa toda la pantalla; barra y panel flotan encima */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;
  background:radial-gradient(110% 80% at 50% 0%,#1a1a1c 0%,#0e0e0f 55%,#070707 100%)}
/* Halo ambiental: versión minúscula de la foto, ampliada y desenfocada (da color al cristal) */
#ambient{position:absolute;left:-15%;top:-15%;width:130%;height:130%;opacity:0;pointer-events:none;
  filter:blur(60px) saturate(1.2);transition:opacity 1.2s var(--ease)}
#app:not(.noimg) #ambient{opacity:.2}
#view{position:absolute;left:0;top:0;display:block;z-index:1}
/* Ombra del color majoritari de la foto: el rectangle és transparent, només es veu l'ombra al voltant */
#photoShadow{--sh:160,160,165;position:absolute;z-index:0;pointer-events:none;border-radius:9px;opacity:0;
  box-shadow:0 34px 90px -6px rgba(var(--sh),.60),0 14px 38px -4px rgba(var(--sh),.40),0 2px 10px rgba(var(--sh),.28),0 0 0 1px rgba(245,245,247,.07);
  transition:box-shadow .7s var(--ease),opacity .4s}

/* Barra superior */
#topbar{position:absolute;z-index:5;left:max(10px,var(--safe-l));right:max(10px,var(--safe-r));top:calc(var(--safe-t) + var(--tb-top));
  height:var(--tb-h);border-radius:28px;display:flex;align-items:center;gap:2px;padding:0 8px 0 6px}
.brand{font-family:var(--serif);font-style:italic;font-weight:400;font-size:23px;line-height:1;margin:0 auto 0 4px;min-width:0;flex:0 1 auto;
  display:flex;align-items:center;gap:6px;padding:0 2px 3px 0;overflow:visible}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--text);margin-top:6px;box-shadow:0 0 12px rgba(245,245,247,.7);flex:none}

/* Panel de herramientas (cristal flotante) */
#dock{position:absolute;z-index:5;left:max(10px,var(--safe-l));right:max(10px,var(--safe-r));bottom:calc(var(--safe-b) + 10px);
  border-radius:28px;padding-bottom:2px;
  transition:opacity .7s var(--ease),transform .8s var(--ease),visibility 0s}
/* Sin foto: el panel se esconde y entra al abrir una */
#app.noimg #dock{opacity:0;transform:translateY(36px) scale(.97);pointer-events:none;visibility:hidden;
  transition:opacity .3s,transform .3s,visibility 0s .3s}
.panel{padding:2px 0 4px}
.panel:not([hidden]){animation:panelIn .45s var(--ease) both}

/* 6. CONTROLES ------------------------------------------------------------ */
/* Botón de icono (círculo) */
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;
  transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease),color .2s}
.ibtn::before{opacity:0}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn.on{background:var(--light);color:var(--ink);box-shadow:0 0 24px var(--glow)}
.ibtn.sq{border-radius:14px;width:42px;height:42px;background:rgba(255,255,255,.04)}
.ibtn.sq::before{opacity:1}

/* Píldora principal (Exporta, Obre una foto) */
.pill{height:38px;padding:0 18px 0 14px;border-radius:19px;background:var(--light);color:var(--ink);font-weight:650;font-size:14px;
  display:flex;align-items:center;gap:8px;margin-left:6px;flex:none;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 22px rgba(245,245,247,.14),0 2px 6px rgba(0,0,0,.4);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .3s}
.pill::before{opacity:0}
.pill:disabled{opacity:.28;cursor:default;box-shadow:none}
.pill.big{height:52px;padding:0 30px 0 24px;border-radius:26px;font-size:15.5px;margin:0}

/* Botones de texto */
.btn{height:38px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.04);font-weight:540;font-size:13.5px;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease),color .2s}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost::before{opacity:0}
.btn.primary{background:var(--light);color:var(--ink);font-weight:650;padding:0 22px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 20px rgba(245,245,247,.12)}
.btn.primary::before{opacity:0}
.btn:disabled{opacity:.4;cursor:default}

/* Microinteracciones: hover = escala 1.02 + resplandor; active = compresión */
@media (hover:hover){
  .ibtn:not(:disabled):hover{transform:scale(1.07);background:rgba(255,255,255,.08);box-shadow:0 0 22px rgba(245,245,247,.10)}
  .ibtn:not(:disabled):hover::before{opacity:1}
  .ibtn.on:hover{background:var(--light)}
  .pill:not(:disabled):hover{transform:scale(1.03);box-shadow:0 1px 0 #fff inset,0 8px 34px rgba(245,245,247,.26),0 2px 6px rgba(0,0,0,.4)}
  .btn:not(:disabled):hover{transform:scale(1.02);background:rgba(255,255,255,.08);box-shadow:0 0 24px rgba(245,245,247,.10)}
  .btn.ghost:not(:disabled):hover{color:var(--text)}
  .btn.ghost:not(:disabled):hover::before{opacity:1}
  .btn.primary:not(:disabled):hover{background:var(--light);box-shadow:0 1px 0 #fff inset,0 8px 30px rgba(245,245,247,.24)}
  .chip:not(.on):hover{transform:scale(1.03);color:var(--text);background:rgba(255,255,255,.07);box-shadow:0 0 20px rgba(245,245,247,.08)}
  .seg button:not(.on):hover{color:var(--text)}
}
.ibtn:not(:disabled):active,.pill:not(:disabled):active,.btn:not(:disabled):active,.chip:active{transform:scale(.97);transition-duration:.08s}

/* Pestañas: control segmentado con indicador de luz que se desliza */
#tools{display:grid;grid-template-columns:repeat(4,1fr);margin:8px 8px 0;padding:4px;border-radius:999px;background:rgba(255,255,255,.035)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.07) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 4px 16px rgba(0,0,0,.4),0 0 26px rgba(245,245,247,.09);
  transition:transform .55s var(--ease)}
#tools[data-active="crop"] .tab-ind{transform:translateX(100%)}
#tools[data-active="styles"] .tab-ind{transform:translateX(200%)}
#tools[data-active="lot"] .tab-ind{transform:translateX(300%)}
#tools button{position:relative;z-index:1;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  color:var(--dim);font-weight:560;font-size:14px;transition:color .3s,transform .3s var(--ease)}
#tools button .ic{width:18px;height:18px}
#tools button.on{color:var(--text)}
@media (hover:hover){#tools button:hover{color:var(--text);transform:scale(1.04)}}
#tools button:active{transform:scale(.97);transition-duration:.08s}

/* Tira de miniatures del lot */
#strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 16px 7px;scrollbar-width:none;
  overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
#strip.dragging{cursor:grabbing}
#strip.dragging .th{pointer-events:none}
#strip::-webkit-scrollbar{display:none}
#strip[hidden]{display:none}
.th .num{position:absolute;right:4px;top:3px;font-size:9.5px;font-weight:650;line-height:1;color:var(--text);padding:2px 4px;border-radius:6px;
  background:rgba(10,10,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;pointer-events:none}
.th{position:relative;flex:none;width:54px;height:54px;border-radius:15px;overflow:hidden;padding:0;scroll-snap-align:center;
  background:rgba(255,255,255,.05);opacity:.5;
  box-shadow:0 0 0 1px rgba(245,245,247,.10);
  transition:transform .35s var(--ease),opacity .3s,box-shadow .35s var(--ease)}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th.on{opacity:1;transform:scale(1.07);box-shadow:0 0 0 2px var(--text),0 0 22px var(--glow)}
.th .ed{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--text);
  box-shadow:0 0 0 1.5px rgba(10,10,10,.75);opacity:0;transform:scale(.4);transition:opacity .25s,transform .3s var(--ease)}
.th.edited .ed{opacity:1;transform:none}
.th .ck{position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;
  background:rgba(10,10,10,.55);box-shadow:0 0 0 1.5px rgba(245,245,247,.7)}
.th .ck::after{content:"";width:8px;height:4px;border:2px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
#strip.sel .th{opacity:.85}
#strip.sel .th .ck{display:grid}
.th.picked .ck{background:var(--light);box-shadow:0 0 0 1.5px #fff}
.th.picked .ck::after{opacity:1}
@media (hover:hover){.th:not(.on):hover{opacity:.95;transform:scale(1.04)}}
.th:active{transform:scale(.96)}

/* Panel Lot */
.lotRow4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px 0}
.lbtn{height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(255,255,255,.04);color:var(--text);font-size:11.5px;font-weight:540;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(245,245,247,.08) inset;
  transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease),opacity .2s}
.lbtn .ic{width:19px;height:19px}
.lbtn:disabled{opacity:.35;cursor:default}
.lbtn.on{background:var(--light);color:var(--ink)}
@media (hover:hover){.lbtn:not(:disabled):hover{transform:scale(1.03);background:rgba(255,255,255,.09);box-shadow:0 0 0 1px rgba(245,245,247,.16) inset,0 0 22px rgba(245,245,247,.09)}.lbtn.on:hover{background:var(--light)}}
.lbtn:not(:disabled):active{transform:scale(.96);transition-duration:.08s}
.lotWrap{display:flex;flex-direction:column;gap:6px;padding:8px 14px 4px}
.lotWrap .btn.primary{width:100%;justify-content:center;height:44px}
.lotWrap .btn .ic{width:17px;height:17px}
.lotRow2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lotRow2 .btn{justify-content:center;padding:0 8px;height:38px;white-space:nowrap;font-size:13px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 30px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 30px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.03);color:var(--muted);font-weight:520;font-size:13.5px;white-space:nowrap;
  transition:transform .3s var(--ease),background .3s var(--ease),color .25s,box-shadow .3s var(--ease)}
.chip.on{color:var(--ink);background:var(--light);font-weight:630;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 24px var(--glow)}
.chip.on::before{opacity:0}
.chip.mod::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text);opacity:.7;margin-left:8px;vertical-align:middle;position:relative;top:-1px}
.chip.on.mod::after{background:var(--ink);opacity:.8}

/* Deslizadores: pista fina con relleno claro desde el cero */
.sliderRow{display:grid;grid-template-columns:32px 1fr 32px 50px;align-items:center;column-gap:4px;padding:4px 14px 0 14px}
.val{text-align:right;font-family:var(--sans);font-weight:560;font-size:15px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:4px}
.sliderRow input[type=range]{min-width:0;height:36px}
.nudge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.04);
  box-shadow:0 0 0 1px rgba(245,245,247,.08) inset;touch-action:manipulation;
  transition:transform .25s var(--ease),background .25s,color .2s,box-shadow .3s var(--ease)}
.nudge .ic{width:17px;height:17px}
@media (hover:hover){.nudge:hover{color:var(--text);background:rgba(255,255,255,.09);transform:scale(1.08);box-shadow:0 0 0 1px rgba(245,245,247,.16) inset,0 0 18px rgba(245,245,247,.10)}}
.nudge:active{transform:scale(.9);background:var(--light);color:var(--ink);transition-duration:.06s}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:40px;background:transparent;touch-action:pan-y;margin:0;--s:50%;--e:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--hair-2) var(--s),rgba(245,245,247,.55) var(--s),var(--text) var(--e),var(--hair-2) var(--e))}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--hair-2) var(--s),rgba(245,245,247,.55) var(--s),var(--text) var(--e),var(--hair-2) var(--e))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;border:0;background:var(--light);
  box-shadow:0 0 0 7px rgba(245,245,247,.08),0 0 18px rgba(245,245,247,.35),0 3px 10px rgba(0,0,0,.7);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:0;background:var(--light);
  box-shadow:0 0 0 7px rgba(245,245,247,.08),0 0 18px rgba(245,245,247,.35),0 3px 10px rgba(0,0,0,.7);transition:transform .25s var(--ease)}
@media (hover:hover){input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}input[type=range]:hover::-moz-range-thumb{transform:scale(1.12)}}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);box-shadow:0 0 0 10px rgba(245,245,247,.10),0 0 26px rgba(245,245,247,.5),0 3px 10px rgba(0,0,0,.7)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22)}

.row{display:flex;align-items:center;gap:8px;padding:2px 16px 4px;flex-wrap:wrap}
#topbar .grow{flex:1}
.row.tight{gap:6px;padding:2px 14px 4px}
.row .grow{flex:1}

/* 7. PANTALLA INICIAL ------------------------------------------------------ */
#empty{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--safe-t) + var(--tb-top) + var(--tb-h) + 24px) 28px calc(var(--safe-b) + 40px);
  background:radial-gradient(60% 45% at 50% 42%,rgba(245,245,247,.07) 0%,transparent 70%)}
#empty .logo{width:92px;height:92px;border-radius:24px;margin-bottom:30px;
  box-shadow:0 0 0 1px var(--hair-2),0 18px 50px rgba(0,0,0,.65),0 0 60px rgba(245,245,247,.07)}
#empty h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,66px);line-height:1.02;letter-spacing:-.005em;max-width:11ch}
#empty h1 em{font-style:italic;color:var(--muted)}
#empty p{margin:18px 0 0;color:var(--muted);max-width:28ch;font-size:15px;line-height:1.5}
#empty .pill{margin:34px 0 0}
#stage.drag::after{content:attr(data-drop);position:absolute;inset:calc(var(--safe-t) + 84px) 14px 14px;border:1px dashed var(--hair-2);border-radius:26px;
  background:rgba(245,245,247,.04);display:grid;place-items:center;color:var(--text);font-family:var(--serif);font-style:italic;font-size:30px;pointer-events:none}
#loading{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(10,10,10,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-family:var(--serif);font-style:italic;font-size:22px;z-index:6}
#loading::before{content:"";width:20px;height:20px;border:2px solid var(--hair-2);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}

/* 8. RETALL ---------------------------------------------------------------- */
#cropLayer{position:absolute;z-index:2;inset:0;pointer-events:none;touch-action:none}
#cropLayer .shade{position:absolute;background:rgba(5,5,5,.7);pointer-events:none}
#cropLayer .box{pointer-events:auto;position:absolute;border:1px solid rgba(245,245,247,.95);box-shadow:0 0 0 1px rgba(0,0,0,.4);touch-action:none;cursor:move}
#cropLayer .box::before,#cropLayer .box::after{content:"";position:absolute;pointer-events:none;inset:0;
  background:linear-gradient(rgba(245,245,247,.35),rgba(245,245,247,.35)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(245,245,247,.35),rgba(245,245,247,.35)) 66.66% 0/1px 100% no-repeat}
#cropLayer .box::after{background:linear-gradient(rgba(245,245,247,.35),rgba(245,245,247,.35)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(245,245,247,.35),rgba(245,245,247,.35)) 0 66.66%/100% 1px no-repeat}
#cropLayer .h{pointer-events:auto;position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;touch-action:none}
#cropLayer .h::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2.5px solid var(--text);border-radius:2px;
  border-right-color:transparent;border-bottom-color:transparent;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
#cropLayer .h[data-h="tr"]::after{transform:rotate(90deg)}
#cropLayer .h[data-h="br"]::after{transform:rotate(180deg)}
#cropLayer .h[data-h="bl"]::after{transform:rotate(270deg)}
#cropLayer .h[data-h="t"],#cropLayer .h[data-h="b"],#cropLayer .h[data-h="l"],#cropLayer .h[data-h="r"]{width:44px;height:44px;margin:-22px 0 0 -22px}
#cropLayer .h[data-h="t"]::after,#cropLayer .h[data-h="b"]::after{width:26px;height:0;border:0;border-top:2.5px solid var(--text);margin:-1.25px 0 0 -13px;border-radius:2px}
#cropLayer .h[data-h="l"]::after,#cropLayer .h[data-h="r"]::after{width:0;height:26px;border:0;border-left:2.5px solid var(--text);margin:-13px 0 0 -1.25px;border-radius:2px}

/* 9. HOJA DE EXPORTACIÓN, TOAST, BADGE -------------------------------------- */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#sheet:not([hidden]){animation:fadeIn .3s var(--ease) both}
#sheet .card{position:relative;width:min(520px,100%);border-radius:28px 28px 0 0;padding:24px 22px calc(22px + var(--safe-b));max-height:90%;overflow:auto;
  background:linear-gradient(180deg,rgba(40,40,43,.82) 0%,rgba(14,14,16,.92) 100%)}
#sheet:not([hidden]) .card{animation:sheetUp .6s var(--ease) both}
#sheet h2{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:36px;line-height:1.05}
.field{display:flex;align-items:center;gap:14px;margin:14px 0}
.field label{width:70px;color:var(--muted);font-size:14px}
.seg{display:flex;padding:3px;border-radius:999px;flex:1;background:rgba(255,255,255,.035)}
.seg button{flex:1;height:34px;border-radius:999px;font-weight:560;font-size:13.5px;color:var(--muted);
  transition:background .35s var(--ease),color .25s,box-shadow .35s var(--ease)}
.seg button.on{background:var(--light);color:var(--ink);font-weight:650;box-shadow:0 0 22px var(--glow)}
select{background:rgba(255,255,255,.035);color:var(--text);border:1px solid var(--hair-2);border-radius:999px;height:42px;padding:0 40px 0 16px;flex:1;
  font:inherit;font-size:14px;-webkit-appearance:none;appearance:none;transition:background .3s,border-color .3s;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 18px,calc(100% - 15px) 18px;background-size:5px 5px;background-repeat:no-repeat}
@media (hover:hover){select:hover{background-color:rgba(255,255,255,.07);border-color:rgba(255,255,255,.28)}}
select option{background:#1b1b1d;color:var(--text)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.sheetActions{padding:16px 0 0}

#toast{position:fixed;z-index:30;left:50%;top:calc(var(--safe-t) + var(--tb-top) + var(--tb-h) + 12px);transform:translate(-50%,-14px) scale(.96);
  padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;max-width:90%;text-align:center;
  transition:opacity .3s var(--ease),transform .4s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#badge{position:absolute;z-index:4;left:50%;top:calc(var(--safe-t) + var(--tb-top) + var(--tb-h) + 12px);transform:translateX(-50%);
  padding:6px 14px;border-radius:16px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
#badge.show{opacity:1}

/* 10. ANIMACIONES ----------------------------------------------------------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Entrada de la app: un único momento orquestado (barra + pantalla inicial escalonada) */
#topbar{animation:dropIn .9s var(--ease) both}
#empty .logo{animation:rise .9s var(--ease) .10s both}
#empty h1{animation:rise .9s var(--ease) .18s both}
#empty p{animation:rise .9s var(--ease) .26s both}
#empty .pill{animation:rise .9s var(--ease) .34s both}

/* 11. ESCRITORIO: barra arriba, panel flotante a la derecha ------------------ */
@media (min-width:900px){
  :root{--tb-top:16px}
  #topbar{left:20px;right:20px}
  #dock{left:auto;right:20px;bottom:auto;top:calc(var(--safe-t) + var(--tb-top) + var(--tb-h) + 12px);width:352px}
  #app.noimg #dock{transform:translateX(34px) scale(.97)}
  .chips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
  #sheet{align-items:center}
  #sheet .card{border-radius:28px}
}
@media (max-width:370px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

/* ===== 12. PANELLS D'IGUAL ALÇADA (referència: Ajustos) ===== */
:root{--ph:140px}
.panel{height:var(--ph);overflow:hidden}
.ibtn.sq{width:38px;height:38px}
.lotRow4{padding:6px 14px 0}
.lbtn{height:46px;gap:3px;font-size:11px;border-radius:14px}
.lbtn .ic{width:17px;height:17px}
.lotWrap{padding:6px 14px 0;gap:5px}
.lotWrap .btn.primary{height:36px}
.lotRow2 .btn{height:30px;font-size:12.5px}

/* ===== 13. BIBLIOTECA DE CARPETES ===== */
#library{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%,rgba(245,245,247,.07),transparent 70%),rgba(10,10,10,.9);
  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%)}
#library[hidden]{display:none}
#library.in{animation:libIn .45s var(--ease) both}
@keyframes libIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.libTop{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 14px 8px}
.libTop h2{margin:0 auto 0 4px;font-family:var(--serif);font-weight:400;font-style:italic;font-size:32px;line-height:1}
.pill.sm{height:36px;padding:0 16px 0 12px;font-size:13.5px;margin:0}
.libBody{flex:1;overflow-y:auto;padding:8px 14px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
#libGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){#libGrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.libBody{padding:8px 28px 32px}}
.fcard{position:relative;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  box-shadow:0 0 0 1px rgba(245,245,247,.10) inset,0 14px 34px rgba(0,0,0,.45);
  animation:rise .6s var(--ease) var(--d,0ms) both;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.fcard.open{box-shadow:0 0 0 1.5px rgba(245,245,247,.75) inset,0 14px 34px rgba(0,0,0,.45),0 0 28px var(--glow)}
@media (hover:hover){.fcard:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 0 0 1px rgba(245,245,247,.2) inset,0 22px 44px rgba(0,0,0,.55),0 0 30px rgba(245,245,247,.08)}}
.fcard:active{transform:scale(.975);transition-duration:.08s}
.fcard .cover{position:relative;aspect-ratio:4/3;background:rgba(255,255,255,.04);display:grid;place-items:center;overflow:hidden}
.fcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .ph .ic{width:34px;height:34px;color:var(--dim)}
.fcard .tag{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:620;padding:3px 8px;border-radius:999px;background:var(--light);color:var(--ink)}
.finfo{padding:10px 12px 12px}
.fname{font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fmeta{margin-top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.facts{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.mini{min-width:30px;height:30px;padding:0 7px;border-radius:15px;display:grid;place-items:center;color:var(--text);
  background:rgba(10,10,10,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(245,245,247,.14) inset;
  transition:transform .25s var(--ease),background .25s}
.mini .ic{width:15px;height:15px}
.mini span{font-size:11.5px;font-weight:620;white-space:nowrap}
.mini.arm{background:var(--light);color:var(--ink)}
@media (hover:hover){.mini:hover{transform:scale(1.1);background:rgba(245,245,247,.2)}.mini.arm:hover{background:var(--light)}}
.mini:active{transform:scale(.92)}
.fcard.new{align-items:center;justify-content:center;gap:12px;min-height:150px;background:none;
  box-shadow:0 0 0 1.5px rgba(245,245,247,.18) inset;border:0;color:var(--text)}
.fcard.new .plus{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--light);color:var(--ink);box-shadow:0 8px 26px rgba(245,245,247,.16)}
.fcard.new .plus .ic{width:24px;height:24px}
.fcard.new .fname{text-align:center}
.libEmpty{margin:40px auto 0;max-width:30ch;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}

/* Diàleg de nom */
#dlg{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn .25s ease both}
#dlg[hidden]{display:none}
#dlg .card{width:min(420px,100%);animation:sheetUp .45s var(--ease) both}
#dlg h2{margin:0 0 6px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px}
.field.col{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:12px}
.field.col label{font-size:12.5px;color:var(--muted)}
#dlg input{height:46px;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.05);
  border:0;box-shadow:0 0 0 1px rgba(245,245,247,.12) inset;outline:none;color-scheme:dark;transition:box-shadow .25s}
#dlg input:focus{box-shadow:0 0 0 1.5px rgba(245,245,247,.6) inset,0 0 20px rgba(245,245,247,.08)}
#dlg .card{position:relative;border-radius:28px;padding:24px 22px 20px}

/* ===== 14. ESTILS ===== */
.stStrip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:9px 14px 4px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 22px),transparent 100%)}
.stStrip::-webkit-scrollbar{display:none}
.stl{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);transition:transform .3s var(--ease),color .2s}
.stl .tile{width:68px;height:60px;border-radius:15px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.05);
  box-shadow:0 0 0 1px rgba(245,245,247,.10) inset;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.stl .tile img{width:100%;height:100%;object-fit:cover;display:block}
.stl .tile img:not([src]){visibility:hidden}
.stl .nm{font-size:11.5px;line-height:14px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stl.act .tile{background:rgba(255,255,255,.04);color:var(--text);box-shadow:0 0 0 1.5px rgba(245,245,247,.2) inset}
.stl.act .tile .ic{width:22px;height:22px}
.stl.sel .nm,.stl.on .nm{color:var(--text)}
.stl.on .tile{box-shadow:0 0 0 2px var(--text),0 0 20px var(--glow)}
.stl.sel:not(.on) .tile{box-shadow:0 0 0 1.5px rgba(245,245,247,.55) inset}
@media (hover:hover){.stl:hover{color:var(--text)}.stl:hover .tile{transform:scale(1.04)}}
.stl:active .tile{transform:scale(.95)}
.stActs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 14px 0}
.stActs .btn{height:32px;padding:0 6px;justify-content:center;font-size:12px;gap:5px;white-space:nowrap;box-shadow:0 0 0 1px rgba(245,245,247,.08) inset}
.stActs .btn .ic{width:15px;height:15px}
#tools button{font-size:13.5px;gap:6px}
@media (max-width:400px){#tools button .ic{width:16px;height:16px}#tools button{font-size:12.5px;gap:5px}}

/* ===== 15. EXTRACCIÓ D'ESTIL ===== */
#dock.ex > :not(#extract){display:none}
#extract{padding:10px 0 4px;animation:panelIn .45s var(--ease) both}
#extract[hidden]{display:none}
.exHead{display:flex;align-items:center;gap:12px;padding:4px 18px 2px}
#exRef{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 1px rgba(245,245,247,.16),0 8px 20px rgba(0,0,0,.5);flex:none}
.exTitle{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.05}
.exSub{margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.3}
.exActs{display:flex;align-items:center;gap:8px;padding:4px 14px 6px}
.exActs .grow{flex:1}
.exActs .btn{height:38px;padding:0 14px;white-space:nowrap;font-size:13px}
.exActs .btn .ic{width:16px;height:16px}

/* ===== 16. INICI ===== */
#home{position:fixed;inset:0;z-index:14;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(90% 45% at 50% 0%,rgba(245,245,247,.08),transparent 70%),rgba(10,10,10,.96);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
#home[hidden]{display:none}
#home.in .homeIn>*{animation:libIn .55s var(--ease) both}
#home.in .homeIn>*:nth-child(2){animation-delay:.05s}#home.in .homeIn>*:nth-child(3){animation-delay:.1s}
#home.in .homeIn>*:nth-child(4){animation-delay:.15s}#home.in .homeIn>*:nth-child(5){animation-delay:.2s}
.homeIn{max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + 34px) 18px calc(var(--safe-b) + 30px)}
.homeHead .hi{font-family:var(--serif);font-style:italic;font-size:44px;line-height:1}
.homeHead .hsub{margin-top:6px;color:var(--muted);font-size:14px}
.continue{display:flex;align-items:center;gap:14px;width:100%;margin-top:22px;padding:12px;border-radius:24px;text-align:left;color:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));box-shadow:0 0 0 1px rgba(245,245,247,.16) inset,0 18px 40px rgba(0,0,0,.5);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.continue[hidden]{display:none}
@media (hover:hover){.continue:hover{transform:scale(1.015);box-shadow:0 0 0 1px rgba(245,245,247,.3) inset,0 22px 48px rgba(0,0,0,.55),0 0 34px rgba(245,245,247,.08)}}
.continue:active{transform:scale(.975);transition-duration:.08s}
.cvr{position:relative;width:84px;height:84px;border-radius:16px;overflow:hidden;flex:none;background:rgba(255,255,255,.05);display:grid;place-items:center}
.cvr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cvr img[hidden]{display:none}
.cph{color:var(--muted)}.cph .ic{width:26px;height:26px}
.ctx{display:flex;flex-direction:column;min-width:0;flex:1}
.clabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cname{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{margin-top:3px;color:var(--muted);font-size:12.5px}
.go{width:38px;height:38px;border-radius:50%;background:#f5f5f7;color:#0a0a0a;display:grid;place-items:center;flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qbtn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;color:inherit;text-align:left;font-size:13.5px;line-height:1.2;
  background:rgba(255,255,255,.05);box-shadow:0 0 0 1px rgba(245,245,247,.12) inset;transition:transform .3s var(--ease),background .3s}
.qbtn .ic{width:20px;height:20px;flex:none}
@media (hover:hover){.qbtn:hover{transform:scale(1.02);background:rgba(255,255,255,.09)}}
.qbtn:active{transform:scale(.97);transition-duration:.08s}
.hsec{margin-top:26px}.hsec[hidden]{display:none}
.hsecHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.hsecHead h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;margin:0}
.link{color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.hrow::-webkit-scrollbar{display:none}
.hf{flex:none;width:120px;text-align:left;color:inherit;transition:transform .3s var(--ease)}
.hf:active{transform:scale(.96)}
@media (hover:hover){.hf:hover{transform:translateY(-3px)}}
.hcv{display:grid;place-items:center;width:120px;height:120px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.05);box-shadow:0 0 0 1px rgba(245,245,247,.12) inset,0 10px 24px rgba(0,0,0,.45);color:var(--muted)}
.hcv img{width:100%;height:100%;object-fit:cover}
.hn{display:block;margin-top:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm{display:block;font-size:11.5px;color:var(--muted)}
.hrow.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:inherit;font-size:13px;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(245,245,247,.14) inset;transition:transform .3s var(--ease)}
.chip:active{transform:scale(.96)}.chip .ic{width:15px;height:15px}
.hempty{color:var(--muted);font-size:13px;line-height:1.4;margin:0}

</style>
</head>

<!-- L'app: la foto ocupa tota la pantalla i la barra i el panell hi suren per sobre com a vidre -->
<div id="app" class="noimg">

  <!-- ESCENARI: halo ambiental + foto + capa de retall + pantalla inicial -->
  <main id="stage" data-drop="Deixa la foto aquí">
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div id="photoShadow" aria-hidden="true"></div>
    <canvas id="view"></canvas>
    <div id="cropLayer" hidden></div>
    <div id="badge"></div>

    <div id="empty">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h1><span data-i18n="emptyTitle1">Dona</span> <em data-i18n="emptyTitle2">llum a les teves fotos</em></h1>
      <p data-i18n="emptyText">Obre una foto per començar. Tot es queda al teu dispositiu.</p>
      <button class="pill big" id="btnOpen2"><svg class="ic" aria-hidden="true"><use href="#i-image-plus"/></svg><span data-i18n="openPhoto">Obre una foto</span></button>
    </div>
    <div id="loading" hidden><span data-i18n="loading">Carregant…</span></div>
  </main>

  <!-- BARRA SUPERIOR (vidre) -->
  <header id="topbar">
    <button class="ibtn" id="btnFolder" data-i18n-title="tipFolder" title="Carpetes"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg></button>
    <button class="ibtn" id="btnOpen" data-i18n-title="tipOpen" title="Afegeix fotos (O)"><svg class="ic" aria-hidden="true"><use href="#i-image-plus"/></svg></button>
    <span class="grow"></span>
    <button class="ibtn" id="btnCompare" data-i18n-title="tipCompare" title="Mantén premut per veure l'original (C)" disabled><svg class="ic" aria-hidden="true"><use href="#i-columns-2"/></svg></button>
    <button class="ibtn" id="btnUndo" data-i18n-title="tipUndo" title="Desfés (Ctrl+Z)" disabled><svg class="ic" aria-hidden="true"><use href="#i-undo-2"/></svg></button>
    <button class="ibtn" id="btnRedo" data-i18n-title="tipRedo" title="Refés (Ctrl+Maj+Z)" disabled><svg class="ic" aria-hidden="true"><use href="#i-redo-2"/></svg></button>
    <button class="pill" id="btnExport" disabled><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="export">Exporta</span></button>
  </header>

  <!-- PANELL D'EINES (vidre) -->
  <section id="dock" aria-label="Eines">
    <!-- Tira de miniatures del lot (només visible amb 2 o més fotos) -->
    <div id="strip" hidden aria-label="Fotos del lot"></div>

    <div id="tools" role="tablist" data-active="adjust">
      <span class="tab-ind" aria-hidden="true"></span>

<script>/* js/geometry.js */
/* Lumen — geometria del retall (funcions pures, sense DOM; es poden provar amb Node).
   Tot s'expressa en píxels del "frame" (imatge ja girada/voltejada), amb Y cap avall.
   Un crop és {x,y,w,h}. L'angle d'endreçat (graus) gira la imatge al voltant del centre del frame. */
(function (root) {
  const RAD = Math.PI / 180;

  function inside(x, y, W, H, ang, eps) {
    eps = eps == null ? 0.5 : eps;
    const a = ang * RAD, c = Math.cos(a), s = Math.sin(a);
    const dx = x - W / 2, dy = y - H / 2;
    const sx = W / 2 + c * dx + s * dy, sy = H / 2 - s * dx + c * dy;
    return sx >= -eps && sx <= W + eps && sy >= -eps && sy <= H + eps;
  }
  function cropInside(cr, W, H, ang) {
    return inside(cr.x, cr.y, W, H, ang) && inside(cr.x + cr.w, cr.y, W, H, ang) &&
      inside(cr.x, cr.y + cr.h, W, H, ang) && inside(cr.x + cr.w, cr.y + cr.h, W, H, ang);
  }
  function scaleAbout(cr, k) {
    const cx = cr.x + cr.w / 2, cy = cr.y + cr.h / 2;
    return { x: cx - cr.w * k / 2, y: cy - cr.h * k / 2, w: cr.w * k, h: cr.h * k };
  }
  function lerpRect(a, b, t) {
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, w: a.w + (b.w - a.w) * t, h: a.h + (b.h - a.h) * t };
  }
  function minSize(W, H) { return Math.max(24, 0.04 * Math.min(W, H)); }

  /** Si el retall surt de la imatge girada, l'encongeix al voltant del centre fins que hi càpiga. */
  function shrinkToFit(cr, W, H, ang) {
    if (cropInside(cr, W, H, ang)) return cr;
    let c0 = cr;
    if (!inside(cr.x + cr.w / 2, cr.y + cr.h / 2, W, H, ang, 0)) c0 = { x: W / 2 - cr.w / 2, y: H / 2 - cr.h / 2, w: cr.w, h: cr.h };
    let lo = 0, hi = 1;
    for (let i = 0; i < 32; i++) {
      const mid = (lo + hi) / 2;
      if (cropInside(scaleAbout(c0, mid), W, H, ang)) lo = mid; else hi = mid;
    }
    return scaleAbout(c0, lo);
  }

  /** Retall més gran possible amb una relació d'aspecte donada, centrat a "center". */
  function fitRatio(center, ratio, W, H, ang) {
    let w = W, h = W / ratio;
    if (h > H) { h = H; w = H * ratio; }
    return shrinkToFit({ x: center.x - w / 2, y: center.y - h / 2, w, h }, W, H, ang);
  }

  /** Aplica una operació (la que veu l'usuari) a un retall. W,H = mida del frame ABANS de l'operació. */
  function transformCrop(cr, W, H, op) {
    switch (op) {
      case 'rotR': return { x: H - (cr.y + cr.h), y: cr.x, w: cr.h, h: cr.w };
      case 'rotL': return { x: cr.y, y: W - (cr.x + cr.w), w: cr.h, h: cr.w };
      case 'flipH': return { x: W - (cr.x + cr.w), y: cr.y, w: cr.w, h: cr.h };
      case 'flipV': return { x: cr.x, y: H - (cr.y + cr.h), w: cr.w, h: cr.h };
    }
    return cr;
  }

  /** Composició d'estat geomètric: la imatge és flip(rot(font)). Girar després de voltejar intercanvia els voltejats. */
  function applyOp(geo, op) {

<script>/* js/zip.js */
/* Lumen — creador de ZIP mínim (sense compressió: les fotos JPG/PNG/WebP ja van comprimides).
   LumenZip.make([{ name: 'foto.jpg', data: Uint8Array }, ...]) -> Blob */
(function (root) {
  'use strict';
  let table = null;
  function crc32(buf) {
    if (!table) {
      table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; table[n] = c >>> 0; }
    }
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function dosTime(d) {
    return { time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),

  }
  function make(files) {
    const enc = new TextEncoder(), parts = [], central = [], dt = dosTime(new Date());
    let offset = 0;
    files.forEach((f) => {
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dt.time, true); lh.setUint16(12, dt.date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, dt.time, true); ch.setUint16(14, dt.date, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);
      offset += 30 + name.length + size;
    });

    central.forEach((c) => { cdSize += c.byteLength !== undefined ? c.byteLength : c.length; });
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

<script>/* js/store.js */
/* Lumen — desat de la sessió (IndexedDB), perquè en tornar a obrir l'app es recuperin fotos, ajustos, retalls i historial.
   Tot es queda al dispositiu. Si IndexedDB no està disponible (finestra privada...), l'app funciona igual però sense desar. */
(function () {
  'use strict';
  const DB = 'lumen', VER = 1;
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('NO_IDB'));
      const rq = indexedDB.open(DB, VER);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    dbp.catch(() => {});
    return dbp;
  }
  const wrap = (rq) => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
  async function tx(stores, mode, fn) {
    const db = await open();
    const t = db.transaction(stores, mode);
    const done = new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    const out = await fn(t);
    await done;
    return out;
  }
  const safe = (p) => p.catch((e) => { console.warn('Lumen store:', e && e.message); return null; });

  window.LumenStore = {
    putFile: (id, blob, name, type) => safe(tx(['files'], 'readwrite', (t) => wrap(t.objectStore('files').put({ id, blob, name, type })))),
    delFiles: (ids) => safe(tx(['files'], 'readwrite', (t) => { const st = t.objectStore('files'); ids.forEach((i) => st.delete(i)); return null; })),
    delFile(id) { return this.delFiles([id]); },
    /** Registres petits (índex de carpetes, estat de cada carpeta) */
    setMeta: (key, val) => safe(tx(['meta'], 'readwrite', (t) => wrap(t.objectStore('meta').put(val, key)))),
    getMeta: (key) => safe(tx(['meta'], 'readonly', (t) => wrap(t.objectStore('meta').get(key)))),
    delMeta: (key) => safe(tx(['meta'], 'readwrite', (t) => wrap(t.objectStore('meta').delete(key)))),
    async getFiles(ids) {
      const out = await safe(tx(['files'], 'readonly', async (t) => {
        const o = {}; for (const id of ids) { const f = await wrap(t.objectStore('files').get(id)); if (f) o[id] = f; } return o;
      }));
      return out || {};
    },
    clear: () => safe(tx(['files', 'meta'], 'readwrite', (t) => { t.objectStore('files').clear(); t.objectStore('meta').clear(); return null; })),
    persist: () => { try { return navigator.storage && navigator.storage.persist ? navigator.storage.persist() : null; } catch (e) { return null; } }
  };
})();

<script>/* js/engine.js */
/* Lumen — motor de render (WebGL2)
   Un sol "fragment shader" fa geometria (rotació 90°, voltejat, endreçar, retall) i ajustos de color.
   Convencions: coordenades d'imatge amb Y cap avall. "Frame" = imatge ja girada/voltejada (W×H),
   i el retall (crop) s'expressa en píxels del frame. */
(function () {
  const VERT = `#version 300 es
  in vec2 a_pos; out vec2 v_uv;
  void main(){ v_uv = vec2(a_pos.x*0.5+0.5, 0.5 - a_pos.y*0.5); gl_Position = vec4(a_pos,0.,1.); }`;

  /* Pipeline de color (qualitat "pro"):
       1) llum LINEAL: la textura és sRGB8 (el GPU la converteix i fa els mipmaps en llum lineal) -> temperatura/tinta, exposició amb
          espatlla suau (no retalla els llums), ombres/llums amb màscara local
       2) espai PERCEPTUAL (sRGB): corba de contrast sense retall, ambient (contrast local multi-escala), vibrància,
          nitidesa només a la luminància (amb nucli anti-soroll i límit de halos), vinyeta
       3) sortida: codificació sRGB exacta + dither triangular (evita bandes als degradats) */
  const FRAG = `#version 300 es
  precision highp float;
  uniform sampler2D u_tex;
  uniform vec2 u_frame;
  uniform vec4 u_crop;   // regió visible (subrectangle) en píxels de frame
  uniform vec4 u_full;   // retall complet (defineix l'àrea vàlida, la vinyeta i la mida del detall)
  uniform float u_angle;
  uniform int u_rot;
  uniform vec2 u_flip;
  uniform float u_ts;    // mida de la textura / mida lògica (la vista prèvia és més petita)
  uniform float u_any;   // 1 si hi ha algun ajust actiu
  uniform vec4 u_a0; // brillantor, contrast, saturació, ambient
  uniform vec4 u_a1; // llums, ombres, temperatura, tinta
  uniform vec2 u_a2; // nitidesa, vinyeta
  in vec2 v_uv; out vec4 o;

  const vec3 W = vec3(0.2126, 0.7152, 0.0722);
  vec2 toSrc(vec2 f, out float inside){
    vec2 c = u_frame*0.5; vec2 d = f - c;
    float ca = cos(u_angle), sa = sin(u_angle);
    vec2 s = c + vec2(ca*d.x + sa*d.y, -sa*d.x + ca*d.y);
    inside = step(0.0,s.x)*step(s.x,u_frame.x)*step(0.0,s.y)*step(s.y,u_frame.y);
    vec2 b = s/u_frame;
    if(u_flip.x > 0.5) b.x = 1.0 - b.x;
    if(u_flip.y > 0.5) b.y = 1.0 - b.y;
    vec2 r;
    if(u_rot == 0) r = b;
    else if(u_rot == 1) r = vec2(b.y, 1.0 - b.x);
    else if(u_rot == 2) r = vec2(1.0 - b.x, 1.0 - b.y);
    else r = vec2(1.0 - b.y, b.x);
    return r;
  }
  vec3 fetchLod(vec2 f, float lod){ float ins; return textureLod(u_tex, toSrc(f, ins), lod).rgb; }
  float lodOf(float rad){ return max(0.0, log2(max(rad*u_ts, 1.0))); }
  vec3 blur4(vec2 f, float rad){
    float l = lodOf(rad);
    return (fetchLod(f+vec2(rad,0.),l)+fetchLod(f-vec2(rad,0.),l)+fetchLod(f+vec2(0.,rad),l)+fetchLod(f-vec2(0.,rad),l))*0.25;
  }
  vec3 blur8(vec2 f, float rad){
    float l = lodOf(rad*0.7); float q = rad*0.7071;
    return (blur4(f, rad)*4.0 + fetchLod(f+vec2(q,q),l)+fetchLod(f+vec2(q,-q),l)+fetchLod(f+vec2(-q,q),l)+fetchLod(f+vec2(-q,-q),l))*0.125;
  }
  float lum(vec3 c){ return dot(c, W); }
  vec3 enc(vec3 x){ x = max(x, 0.0); return mix(x*12.92, 1.055*pow(x, vec3(1.0/2.4)) - 0.055, step(0.0031308, x)); }
  vec3 dec(vec3 x){ x = max(x, 0.0); return mix(x/12.92, pow((x+0.055)/1.055, vec3(2.4)), step(0.04045, x)); }
  float pe(float L){ return pow(max(L, 1e-5), 0.4545); }
  float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  // Corba de contrast tipus "gain" simètrica: extrems fixos, cap retall
  float gainC(float x, float a){
    x = clamp(x, 0.0, 1.0);
    return x < 0.5 ? 0.5*pow(2.0*x, a) : 1.0 - 0.5*pow(2.0*(1.0-x), a);
  }

  void main(){
    vec2 f0 = u_crop.xy + v_uv*u_crop.zw;
    float ins; vec2 r = toSrc(f0, ins);
    ins *= step(u_full.x, f0.x)*step(f0.x, u_full.x+u_full.z)*step(u_full.y, f0.y)*step(f0.y, u_full.y+u_full.w);
    vec3 c0 = texture(u_tex, r, -0.4).rgb;   // lineal (textura sRGB8). Biaix negatiu = reducció més nítida
    vec3 c = c0;

    if(u_any > 0.5){
      float bri=u_a0.x, con=u_a0.y, sat=u_a0.z, amb=u_a0.w;
      float hi=u_a1.x, sh=u_a1.y, warm=u_a1.z, tint=u_a1.w;
      float sharp=u_a2.x, vig=u_a2.y;
      float longSide = max(u_full.z, u_full.w);

      // 1) Balanç de blancs en llum lineal (conserva la lluminositat global)
      if(warm != 0.0 || tint != 0.0){
        vec3 g = vec3(exp2(warm*0.42 + tint*0.07), exp2(-tint*0.24), exp2(-warm*0.42 + tint*0.07));
        c *= g / dot(g, W);
      }
      // 2) Exposició lineal amb espatlla suau per als llums (no es cremen de cop)
      if(bri != 0.0){
        c *= exp2(bri*1.5);
        if(bri > 0.0){
          float L = lum(c);
          float Ln = L > 0.75 ? 0.75 + 0.25*(1.0 - exp(-(L-0.75)/0.25)) : L;
          c = mix(c, c*(Ln/max(L,1e-4)), clamp(bri*3.0, 0.0, 1.0));
        }
      }
      // 3) Ombres i llums amb màscara local (barreja de píxel i entorn) => sense halos grisos
      if(sh != 0.0 || hi != 0.0){
        float Lb = lum(blur4(f0, longSide*0.018));
        float m = mix(pe(lum(c)), pe(Lb*exp2(bri*1.5)), 0.5);
        float wS = 1.0 - smoothstep(0.04, 0.62, m);
        float wH = smoothstep(0.38, 0.96, m);
        c *= exp2(sh*1.35*wS + hi*0.95*wH);
      }

      // --- espai perceptual ---
      vec3 p = enc(c);
      // 4) Contrast: corba suau al voltant del gris mitjà (50% per canal + 50% conservant el to)
      if(con != 0.0){
        float a = exp2(con*0.95);
        vec3 over = p - clamp(p, 0.0, 1.0);
        vec3 pc = vec3(gainC(p.r,a), gainC(p.g,a), gainC(p.b,a));
        float Lp = max(dot(p, W), 1e-4);
        vec3 pl = p * (gainC(Lp, a)/Lp);
        p = mix(pc, pl, 0.5) + over;
      }
      // 5) Ambient: contrast local multi-escala només a la luminància + una mica de color
      if(amb != 0.0){
        float Lp = max(dot(p, W), 1e-4);
        float b1 = pe(lum(blur4(f0, longSide*0.010)));
        float b2 = pe(lum(blur4(f0, longSide*0.035)));
        float d = Lp - mix(b1, b2, 0.6);
        float mid = 1.0 - 0.85*pow(abs(2.0*Lp - 1.0), 3.0);
        p *= max(Lp + d*amb*1.9*mid, 0.0) / Lp;
        sat += amb*0.28;
      }
      // 6) Saturació amb vibrància: els colors ja saturats es protegeixen d'una sobresaturació
      if(sat != 0.0){
        float Lg = dot(p, W);
        float chroma = max(max(p.r,p.g),p.b) - min(min(p.r,p.g),p.b);
        float k = sat > 0.0 ? sat*(1.0 - 0.6*smoothstep(0.15, 0.75, chroma)) : sat;
        p = max(vec3(Lg) + (p - vec3(Lg))*(1.0 + k), 0.0);
      }
      // 7) Nitidesa: màscara d'enfocament només a la luminància, amb nucli anti-soroll i límit de halos
      if(sharp > 0.0){
        float rad = max(longSide*0.0011, 0.9/max(u_ts, 0.01));
        float dL = pe(lum(c0)) - pe(lum(blur8(f0, rad)));
        dL *= smoothstep(0.003, 0.016, abs(dL));
        dL = 0.10*tanh(dL/0.10);
        p += dL*sharp*1.5;
      }
      // 8) Vinyeta
      if(vig != 0.0){
        vec2 pf = (f0 - u_full.xy) / u_full.zw;
        vec2 q = (pf - 0.5) * vec2(mix(1.0, u_full.z/u_full.w, 0.6), 1.0);
        float m = smoothstep(0.28, 1.0, length(q)*1.45);
        m *= m*(3.0 - 2.0*m) * 0.5 + m*0.5;
        if(vig > 0.0) p = mix(p, vec3(1.0), vig*0.5*m); else p *= 1.0 + vig*0.9*m;
      }
      // 9) Dither triangular (±1 nivell de 8 bits) contra les bandes
      float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.31) - 1.0;
      p += n/255.0;
      c = clamp(p, 0.0, 1.0);
    } else {
      c = enc(c);
    }
    o = vec4(c*ins, ins);
  }`;

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  const ADJ_KEYS = ['brightness', 'contrast', 'saturation', 'ambience', 'highlights', 'shadows', 'warmth', 'tint', 'sharpen', 'vignette'];

  class Engine {
    constructor() {

      ['u_tex', 'u_frame', 'u_crop', 'u_full', 'u_angle', 'u_rot', 'u_flip', 'u_a0', 'u_a1', 'u_a2', 'u_ts', 'u_any'].forEach((n) => (this.u[n] = gl.getUniformLocation(prog, n)));

    logical(w, h) {

      return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)), downscaled: k < 1 };
    }

    load(key, img, lw, lh) {

      const L = this.logical(lw || w, lh || h);
      // si la imatge supera el màxim de textura es redueix; mida de textura mai més gran que la lògica
      if (w > L.w || h > L.h) {

        const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, L.w, L.h);

      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.generateMipmap(gl.TEXTURE_2D);

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      return { w: L.w, h: L.h, downscaled: L.downscaled };
    }
    /** Fa servir la textura de la clau (instantani). */
    use(key) {

      this.tex = e.tex; this.cur = key; this.srcW = e.w; this.srcH = e.h;
      this.ts = Math.max(e.tw, e.th) / Math.max(e.w, e.h);

    static frameSize(w, h, rot) { return rot % 2 ? { w: h, h: w } : { w, h }; }

      const gl = this.gl;

      if (!this.tex) return;
      const f = Engine.frameSize(this.srcW, this.srcH, geo.rot);
      gl.uniform2f(this.u.u_frame, f.w, f.h);
      gl.uniform4f(this.u.u_crop, geo.crop.x, geo.crop.y, geo.crop.w, geo.crop.h);
      const fu = full || geo.crop;
      gl.uniform4f(this.u.u_full, fu.x, fu.y, fu.w, fu.h);
      gl.uniform1f(this.u.u_angle, (geo.angle || 0) * Math.PI / 180);
      gl.uniform1i(this.u.u_rot, geo.rot | 0);
      gl.uniform2f(this.u.u_flip, geo.flipH ? 1 : 0, geo.flipV ? 1 : 0);
      const a = (k) => (adj && adj[k]) || 0;
      gl.uniform4f(this.u.u_a0, a('brightness'), a('contrast'), a('saturation'), a('ambience'));
      gl.uniform4f(this.u.u_a1, a('highlights'), a('shadows'), a('warmth'), a('tint'));
      gl.uniform2f(this.u.u_a2, Math.max(0, a('sharpen')), a('vignette'));
      gl.uniform1f(this.u.u_ts, this.ts);
      gl.uniform1f(this.u.u_any, ADJ_KEYS.some((k) => Math.abs(a(k)) > 1e-6) ? 1 : 0);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    toBlob(type, quality) {
      return new Promise((res) => this.canvas.toBlob(res, type, quality));
    }
  }

  window.LumenEngine = Engine;
  window.ADJ_KEYS = ADJ_KEYS;
})();

<script>/* js/app.js */
/* Lumen — nucli de l'app: estat, historial, vista (zoom/pan), ajustos, obrir fitxers i exportació. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const t = (k) => I18N.t(k);
  const L = (window.L = {});

  const ADJ = [
    { k: 'brightness', min: -100, max: 100 }, { k: 'contrast', min: -100, max: 100 },
    { k: 'saturation', min: -100, max: 100 }, { k: 'ambience', min: -100, max: 100 },
    { k: 'highlights', min: -100, max: 100 }, { k: 'shadows', min: -100, max: 100 },
    { k: 'warmth', min: -100, max: 100 }, { k: 'tint', min: -100, max: 100 },
    { k: 'sharpen', min: 0, max: 100 }, { k: 'vignette', min: -100, max: 100 }
  ];
  const zero = () => Object.fromEntries(ADJ.map((a) => [a.k, 0]));

  const S = (L.S = {
    name: 'foto', srcW: 0, srcH: 0, has: false,
    adj: zero(), geo: null, history: [], future: [],
    mode: 'adjust', view: { zoom: 1, cx: 0, cy: 0 },
    comparing: false, editing: false, sel: 'brightness',
    draft: null, ratioId: 'free'
  });
  L.t = t;
  L.zero = zero;
  L.hooks = { items() {}, thumb() {}, dirty() {}, folder() {}, openLibrary() {} };   // batch.js se'n serveix per pintar la tira i el panell Lot

  const stage = $('stage'), view = $('view'), ctx = view.getContext('2d');
  const amb = $('ambient'), actx = amb.getContext('2d', { willReadFrequently: true }), shadowEl = $('photoShadow');
  const bar = $('topbar'), dock = $('dock');
  let engine = null;
  try { engine = L.engine = new LumenEngine(); } catch (e) { setTimeout(() => toast(t('toastNoGL')), 300); }

  /* ---------- Utilitats ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
  L.toast = toast;
  let badgeTimer = 0;
  function flash(msg) {
    const b = $('badge'); b.textContent = msg; b.classList.add('show');
    clearTimeout(badgeTimer); badgeTimer = setTimeout(() => b.classList.remove('show'), 900);
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- Geometria de la vista ---------- */
  L.frame = () => LumenEngine.frameSize(S.srcW, S.srcH, S.geo.rot);
  function contentRect() {
    if (S.mode === 'crop') { const f = L.frame(); return { x: 0, y: 0, w: f.w, h: f.h }; }
    return S.geo.crop;
  }
  L.contentRect = contentRect;
  /* Marges: la foto ocupa tot l'escenari però es col·loca entre la barra i el panell (que suren com a vidre) */
  const ins = { t: 0, l: 0, r: 0, b: 0 };
  function measure() {
    const wide = window.matchMedia('(min-width:900px)').matches;
    ins.t = bar.offsetTop + bar.offsetHeight + 12;
    ins.l = ins.r = ins.b = wide ? 20 : 10;
    if (S.has) {
      const cs = getComputedStyle(dock);
      if (wide) ins.r = dock.offsetWidth + (parseFloat(cs.right) || 20) + 20;
      else ins.b = dock.offsetHeight + (parseFloat(cs.bottom) || 10) + 12;
    }
  }
  const ctr = () => ({ x: ins.l + (stage.clientWidth - ins.l - ins.r) / 2, y: ins.t + (stage.clientHeight - ins.t - ins.b) / 2 });
  const PAD = 6;
  function fit(C) { return Math.min((stage.clientWidth - ins.l - ins.r - 2 * PAD) / C.w, (stage.clientHeight - ins.t - ins.b - 2 * PAD) / C.h); }
  L.scale = () => fit(contentRect()) * S.view.zoom;           // px CSS per px de frame
  L.toScreen = (x, y) => {                                      // coordenades de frame -> escenari
    const C = contentRect(), sc = L.scale(), c = ctr();
    return { x: c.x + (x - C.x - S.view.cx) * sc, y: c.y + (y - C.y - S.view.cy) * sc };
  };
  function screenToContent(mx, my) {
    const sc = L.scale(), c = ctr();
    return { x: S.view.cx + (mx - c.x) / sc, y: S.view.cy + (my - c.y) / sc };
  }
  function clampView() {
    const C = contentRect();
    if (S.view.zoom <= 1.001) { S.view.zoom = 1; S.view.cx = C.w / 2; S.view.cy = C.h / 2; }
    else { S.view.cx = clamp(S.view.cx, 0, C.w); S.view.cy = clamp(S.view.cy, 0, C.h); }
  }
  L.resetView = () => { S.view.zoom = 1; clampView(); };

  /* ---------- Dibuix ---------- */
  let raf = 0;
  L.draw = () => { if (!raf) raf = requestAnimationFrame(draw); };
  function draw() {
    raf = 0;
    if (!S.has || !engine) return;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    if (!sw || !sh) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(sw * dpr), H = Math.round(sh * dpr);
    if (view.width !== W || view.height !== H) { view.width = W; view.height = H; }
    view.style.width = sw + 'px'; view.style.height = sh + 'px';
    measure();
    clampView();
    const C = contentRect(), k = L.scale() * dpr, c = ctr();
    const sub = { x: C.x + S.view.cx - c.x * dpr / k, y: C.y + S.view.cy - c.y * dpr / k, w: W / k, h: H / k };
    const geo = { rot: S.geo.rot, flipH: S.geo.flipH, flipV: S.geo.flipV, angle: S.geo.angle, crop: sub };
    engine.render(W, H, geo, S.comparing ? null : S.adj, C);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(engine.canvas, 0, 0);
    scheduleAmbient();
    placeShadow(C, c);
    if (L.crop) L.crop.sync();
    L.hooks.dirty();
    persistCheck();
  }

  /* ---------- Marc de la foto: cantonades suaus + ombra del color majoritari ---------- */
  function placeShadow(C, c) {
    if (S.mode === 'crop') { shadowEl.style.opacity = 0; view.style.clipPath = ''; return; }
    const sc = L.scale();
    const x = c.x - S.view.cx * sc, y = c.y - S.view.cy * sc, w = C.w * sc, h = C.h * sc;
    const st = shadowEl.style;
    st.opacity = 1; st.left = x + 'px'; st.top = y + 'px'; st.width = w + 'px'; st.height = h + 'px';
    const sw = stage.clientWidth, sh = stage.clientHeight, R = 9;
    const l = Math.max(0, x), tp = Math.max(0, y), r = Math.max(0, sw - (x + w)), b = Math.max(0, sh - (y + h));

  }
  /* Color majoritari: histograma de 4 bits per canal sobre la miniatura (pesant una mica els colors vius) */
  function dominantColor(data) {
    const bins = new Map();
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] < 200) continue;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx < 18) continue;                              // ignora el negre pur
      const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
      const e = bins.get(key) || { n: 0, r: 0, g: 0, b: 0 };
      const wgt = 1 + 1.2 * (mx - mn) / 255;
      e.n += wgt; e.r += r * wgt; e.g += g * wgt; e.b += b * wgt; bins.set(key, e);
    }
    let best = null; bins.forEach((e) => { if (!best || e.n > best.n) best = e; });
    return best ? [best.r / best.n, best.g / best.n, best.b / best.n] : [160, 160, 165];
  }
  /* Fa que l'ombra es vegi sobre el fons negre: eleva la lluminositat sense perdre el to */
  function glowColor([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, sat = 0, l = (mx + mn) / 2;
    const d = mx - mn;
    if (d > 1e-4) {
      sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
    }
    if (sat < 0.1) { sat = 0; l = 0.78; } else { sat = Math.min(1, Math.max(sat, 0.45)); l = Math.min(0.62, Math.max(l, 0.46)); }
    const q = l < 0.5 ? l * (1 + sat) : l + sat - l * sat, p = 2 * l - q;
    const f = (tt) => { tt = (tt + 360) % 360 / 360; tt = tt < 0 ? tt + 1 : tt; return tt < 1 / 6 ? p + (q - p) * 6 * tt : tt < 1 / 2 ? q : tt < 2 / 3 ? p + (q - p) * (2 / 3 - tt) * 6 : p; };
    return sat === 0 ? [l * 255, l * 255, l * 255] : [f(h + 120) * 255, f(h) * 255, f(h - 120) * 255].map((v) => Math.round(v));
  }

  /* ---------- Halo ambiental: miniatura de la foto, ampliada i difuminada per CSS ---------- */
  let ambTimer = 0;
  function scheduleAmbient() { if (!ambTimer) ambTimer = setTimeout(() => { ambTimer = 0; paintAmbient(); }, 220); }
  function paintAmbient() {
    if (!S.has || !view.width) return;
    const w = 28, h = Math.max(2, Math.round(w * view.height / view.width));
    if (amb.width !== w || amb.height !== h) { amb.width = w; amb.height = h; }
    actx.clearRect(0, 0, w, h);
    actx.drawImage(view, 0, 0, w, h);
    try {
      const col = glowColor(dominantColor(actx.getImageData(0, 0, w, h).data));
      shadowEl.style.setProperty('--sh', col.map(Math.round).join(','));
    } catch (e) { /* lectura de píxels no disponible: queda l'últim color */ }
  }

  /* ---------- Historial ---------- */
  const snap = () => JSON.stringify({ adj: S.adj, geo: S.geo });
  L.push = () => { S.history.push(snap()); if (S.history.length > 100) S.history.shift(); S.future.length = 0; updateBtns(); };
  function restore(str) {
    const o = JSON.parse(str);
    S.adj = Object.assign(zero(), o.adj); S.geo = o.geo || defGeo(S.srcW, S.srcH);
    S.draft = S.mode === 'crop' ? Object.assign({}, S.geo.crop) : null;
    L.resetView(); syncUI(); L.draw(); updateBtns();
  }
  function undo() { if (!S.history.length) return; S.future.push(snap()); restore(S.history.pop()); }
  function redo() { if (!S.future.length) return; S.history.push(snap()); restore(S.future.pop()); }
  function updateBtns() {
    $('btnUndo').disabled = !S.history.length; $('btnRedo').disabled = !S.future.length;
  }

  /* ---------- Lliscadors: farciment des de zero (o des de l'esquerra) fins al valor ---------- */
  function paint(el) {
    const min = +el.min, max = +el.max, v = +el.value;
    const pct = (x) => clamp((x - min) / (max - min) * 100, 0, 100);
    const a = pct(v), z = pct(0);
    el.style.setProperty('--s', Math.min(a, z) + '%');
    el.style.setProperty('--e', Math.max(a, z) + '%');
  }
  L.paint = paint;

  /* ---------- Ajustos ---------- */
  const chipsEl = $('adjChips'), slider = $('adjSlider');
  ADJ.forEach((a) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.k = a.k; b.textContent = t('adj_' + a.k);
    b.addEventListener('click', () => select(a.k));
    chipsEl.appendChild(b);
  });
  function updateVal() {
    const v = Math.round(S.adj[S.sel] * 100);
    $('adjVal').textContent = (v > 0 && ADJ.find((a) => a.k === S.sel).min < 0 ? '+' : '') + v;
  }
  function markChips() {
    chipsEl.querySelectorAll('.chip').forEach((c) => {
      c.classList.toggle('on', c.dataset.k === S.sel);
      c.classList.toggle('mod', Math.abs(S.adj[c.dataset.k]) > 1e-6);
    });
  }
  function select(k) {
    S.sel = k;
    const a = ADJ.find((x) => x.k === k);
    slider.min = a.min; slider.max = a.max; slider.step = 1;
    slider.value = Math.round(S.adj[k] * 100);
    paint(slider);
    updateVal(); markChips();
  }
  slider.addEventListener('input', () => {
    if (!S.has) return;
    if (!S.editing) { L.push(); S.editing = true; }
    S.adj[S.sel] = slider.value / 100;
    paint(slider); updateVal(); markChips(); L.draw();
  });
  slider.addEventListener('change', () => { S.editing = false; });
  $('btnResetOne').addEventListener('click', () => {
    if (!S.has || S.adj[S.sel] === 0) return;
    L.push(); S.adj[S.sel] = 0; select(S.sel); L.draw();
  });
  $('btnResetAll').addEventListener('click', () => {
    if (!S.has || ADJ.every((a) => S.adj[a.k] === 0)) return;
    L.push(); S.adj = zero(); select(S.sel); L.draw(); toast(t('toastReset'));
  });
  function syncUI() { select(S.sel); if (L.crop) L.crop.syncUI(); }
  L.syncUI = syncUI;

  /* ---------- Pestanyes (Ajustos · Retall · Lot) ---------- */
  const TAB = { adjust: 'Adj', crop: 'Crop', styles: 'Styles', lot: 'Lot' };
  function applyTabs(m) {
    Object.keys(TAB).forEach((k) => {
      $('tab' + TAB[k]).classList.toggle('on', k === m);
      $('tab' + TAB[k]).setAttribute('aria-selected', k === m);
      $('panel' + TAB[k]).hidden = k !== m;
    });
    $('tools').dataset.active = m;
  }
  function setMode(m) {
    if (m === S.mode) return;
    if (m === 'crop' && !S.has) return;
    if (S.mode === 'crop' && L.crop) L.crop.leave(true);
    S.mode = m;
    applyTabs(m);
    if (m === 'crop' && L.crop) L.crop.enter();
    L.resetView(); L.draw();
  }
  L.setMode = setMode;
  $('tabAdj').addEventListener('click', () => setMode('adjust'));
  $('tabCrop').addEventListener('click', () => setMode('crop'));
  $('tabStyles').addEventListener('click', () => setMode('styles'));
  $('tabLot').addEventListener('click', () => setMode('lot'));

  /* ---------- Gestos de la vista: zoom i desplaçament ---------- */
  const ptrs = new Map();
  let gesture = null, lastTap = { t: 0, x: 0, y: 0 };
  const rectOf = () => stage.getBoundingClientRect();
  function zoomAt(mx, my, newZoom) {
    const anchor = screenToContent(mx, my);
    S.view.zoom = clamp(newZoom, 1, 10);
    const sc = L.scale();
    const c = ctr();
    S.view.cx = anchor.x - (mx - c.x) / sc;
    S.view.cy = anchor.y - (my - c.y) / sc;
    clampView(); L.draw(); flash('×' + S.view.zoom.toFixed(1));
  }
  stage.addEventListener('pointerdown', (e) => {
    if (!S.has || S.mode === 'crop' || e.target.closest('button')) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { lx: e.clientX, ly: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false });

      const [a, b] = [...ptrs.values()], r = rectOf();
      gesture = { type: 'pinch', d0: Math.hypot(a.lx - b.lx, a.ly - b.ly) || 1, z0: S.view.zoom,
        anchor: screenToContent((a.lx + b.lx) / 2 - r.left, (a.ly + b.ly) / 2 - r.top) };
    } else gesture = { type: 'pan' };
  });

    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.lx, dy = e.clientY - p.ly;
    p.lx = e.clientX; p.ly = e.clientY;
    if (Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 8) p.moved = true;
    if (gesture && gesture.type === 'pinch' && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], r = rectOf();
      const d = Math.hypot(a.lx - b.lx, a.ly - b.ly), mx = (a.lx + b.lx) / 2 - r.left, my = (a.ly + b.ly) / 2 - r.top;
      S.view.zoom = clamp(gesture.z0 * d / gesture.d0, 1, 10);
      const sc = L.scale();
      const c = ctr();
      S.view.cx = gesture.anchor.x - (mx - c.x) / sc;
      S.view.cy = gesture.anchor.y - (my - c.y) / sc;
      clampView(); L.draw();
    } else if (ptrs.size === 1 && S.view.zoom > 1.001) {
      const sc = L.scale();
      S.view.cx -= dx / sc; S.view.cy -= dy / sc; clampView(); L.draw();
    } else if (ptrs.size === 1 && items.length > 1) {
      /* Llisca cap als costats per canviar de foto (només amb zoom 1) */
      const sx = e.clientX - p.x0, sy = e.clientY - p.y0;
      if (!p.sw && Math.abs(sx) > 12 && Math.abs(sx) > Math.abs(sy) * 1.3) p.sw = true;
      if (p.sw) {
        const edge = (sx > 0 && L.cur === 0) || (sx < 0 && L.cur === items.length - 1);
        const off = sx * (edge ? 0.18 : 0.7);
        view.style.transition = 'none';
        view.style.transform = 'translateX(' + off + 'px)';
        view.style.opacity = String(1 - Math.min(0.5, Math.abs(off) / 500));
      }
    }
  });
  function resetSwipe() {
    view.style.transition = 'transform .35s cubic-bezier(.22,1,.36,1),opacity .35s';
    view.style.transform = ''; view.style.opacity = '';
  }

    const p = ptrs.get(e.pointerId); if (!p) return;
