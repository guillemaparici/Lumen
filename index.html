      if (e.type === 'pointerup' && (Math.abs(sx) > Math.min(110, stage.clientWidth * 0.22) || fast) && L.go(sx < 0 ? 1 : -1)) {
        /* la foto nova ja neteja la transformació quan estigui llesta (activate) */
      } else resetSwipe();
      if (ptrs.size === 0) gesture = null;
      return;
    }
    const now = performance.now();
    if (e.type === 'pointerup' && !p.moved && now - p.t0 < 300 && ptrs.size === 0 && gesture && gesture.type === 'pan') {
      if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
        const r = rectOf(); zoomAt(e.clientX - r.left, e.clientY - r.top, S.view.zoom > 1.05 ? 1 : 2.5);
        lastTap.t = 0;
      } else lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
    if (ptrs.size === 1) gesture = { type: 'pan' };
    if (ptrs.size === 0) gesture = null;
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('dblclick', (e) => {
    if (!S.has || S.mode === 'crop' || e.pointerType === 'touch') return;
    const r = rectOf(); zoomAt(e.clientX - r.left, e.clientY - r.top, S.view.zoom > 1.05 ? 1 : 2.5);
  });
  stage.addEventListener('wheel', (e) => {
    if (!S.has || S.mode === 'crop') return;
    e.preventDefault();
    const r = rectOf();
    zoomAt(e.clientX - r.left, e.clientY - r.top, S.view.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });

  /* ---------- Comparar (mantenir premut) ---------- */
  function setCompare(on) { if (!S.has || S.comparing === on) return; S.comparing = on; $('btnCompare').classList.toggle('on', on); L.draw(); }
  const bc = $('btnCompare');
  bc.addEventListener('pointerdown', (e) => { e.preventDefault(); bc.setPointerCapture(e.pointerId); setCompare(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => bc.addEventListener(ev, () => setCompare(false)));
  bc.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------- Lot de fotos ----------
     Cada foto guarda el seu estat (ajustos, retall, historial). Per canviar de foto sense espera:
       · es mantenen a la GPU les textures de les fotos veïnes (precàrrega ±1, ±2) => canvi instantani
       · cada foto té una vista prèvia de 1024px que es mostra a l'instant mentre es descodifica l'original */
  const items = (L.items = []);
  L.cur = -1;
  let nid = 1, actToken = 0;
  const COARSE = matchMedia('(pointer:coarse)').matches;
  const TEXCAP = COARSE ? 3 : 5;               // textures completes en memòria de la GPU
  const defGeo = (w, h) => ({ rot: 0, flipH: false, flipV: false, angle: 0, crop: { x: 0, y: 0, w, h } });
  L.defGeo = defGeo;
  const tk = (it) => 'i' + it.id, pk = (it) => 'p' + it.id;

  async function decodeViaImg(file) {
    const url = URL.createObjectURL(file), img = new Image();
    img.src = url;
    try { await img.decode(); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
    return img;
  }
  async function decodeFile(file) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image', premultiplyAlpha: 'none' }); }
    catch (e) { return decodeViaImg(file); }
  }
  function saveCur() {
    const it = items[L.cur]; if (!it || !S.has) return;
    it.adj = S.adj; it.geo = S.geo; it.history = S.history; it.future = S.future; it.ratioId = S.ratioId; it.w = S.srcW; it.h = S.srcH;
  }
  L.saveCur = saveCur;

  /* A partir d'un bitmap descodificat: mida lògica, vista prèvia i miniatura (una sola descodificació) */
  function fillFromBitmap(it, bmp) {
    const bw = bmp.width || bmp.naturalWidth, bh = bmp.height || bmp.naturalHeight;
    const lg = engine.logical(bw, bh); it.w = lg.w; it.h = lg.h;
    if (it.prev) return;
    const k = Math.min(1, 1024 / Math.max(bw, bh));
    const pv = document.createElement('canvas'); pv.width = Math.max(1, Math.round(bw * k)); pv.height = Math.max(1, Math.round(bh * k));
    const px = pv.getContext('2d'); px.imageSmoothingQuality = 'high'; px.drawImage(bmp, 0, 0, pv.width, pv.height);
    it.prev = pv;
    const T = 112, tc = document.createElement('canvas'); tc.width = tc.height = T;
    const kk = Math.max(T / pv.width, T / pv.height), dw = pv.width * kk, dh = pv.height * kk;
    const tx = tc.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(pv, (T - dw) / 2, (T - dh) / 2, dw, dh);
    it.thumb = tc.toDataURL('image/jpeg', 0.74);
    L.hooks.thumb(it);
  }

  /* Descodifica l'original i el puja a la GPU (una sola vegada, encara que es demani des de dos llocs) */
  function loadFull(it) {
    if (engine.has(tk(it))) return Promise.resolve(true);
    if (it.loading) return it.loading;
    it.loading = (async () => {
      const bmp = await decodeFile(it.file);
      try {
        if (!items.includes(it)) return false;
        const info = engine.load(tk(it), bmp); it.w = info.w; it.h = info.h;
        if (!it.prev) fillFromBitmap(it, bmp);
        if (info.downscaled) it.big = true;
      } finally { if (bmp.close) bmp.close(); }
      return true;
    })().finally(() => { it.loading = null; });
    return it.loading;
  }
  /* Manté com a màxim TEXCAP textures completes: s'eliminen les més llunyanes de la foto activa */
  function evict() {
    const full = engine.keys().filter((k) => k[0] === 'i');
    const idx = (k) => items.findIndex((x) => tk(x) === k);
    const orphan = full.filter((k) => idx(k) < 0); orphan.forEach((k) => engine.drop(k));
    let keys = full.filter((k) => idx(k) >= 0);
    if (keys.length > TEXCAP) {
      keys.sort((a, b) => Math.abs(idx(b) - L.cur) - Math.abs(idx(a) - L.cur));
      while (keys.length > TEXCAP && keys[0] !== (items[L.cur] && tk(items[L.cur]))) engine.drop(keys.shift());
    }
    engine.keys().filter((k) => k[0] === 'p' && !(items[L.cur] && k === pk(items[L.cur]))).forEach((k) => engine.drop(k));
  }
  let preTimer = 0;
  function preloadSoon() {
    clearTimeout(preTimer);
    preTimer = setTimeout(async () => {
      const token = actToken, c = L.cur;
      for (const d of [1, -1, 2, -2]) {
        if (token !== actToken || Math.abs(d) * 2 > TEXCAP + 1 && COARSE) break;
        const it = items[c + d]; if (!it || it.bad) continue;
        try { await loadFull(it); } catch (e) { it.bad = true; }
        await new Promise((r) => setTimeout(r, 30));
      }
      if (token === actToken) evict();
    }, 420);
  }

  /* Activa la foto i-èssima. Retorna true / false (cancel·lada o ja activa) / 'err' (no s'ha pogut obrir) */
  async function activate(i, dir) {
    if (L.lock) return false;                    // mentre s'extreu un estil no es pot canviar de foto
    if (!engine) { toast(t('toastNoGL')); return 'err'; }
    if (i < 0 || i >= items.length) return false;
    if (i === L.cur && S.has) return true;
    const token = ++actToken, it = items[i];
    let useKey = engine.has(tk(it)) ? tk(it) : null, partial = false;
    if (!useKey) {
      if (it.prev && it.w) {          // vista prèvia instantània + original en segon pla
        if (!engine.has(pk(it))) engine.load(pk(it), it.prev, it.w, it.h);
        useKey = pk(it); partial = true;
      } else {
        const slow = setTimeout(() => { if (token === actToken) $('loading').hidden = false; }, 200);
        try { await loadFull(it); }
        catch (e) { console.error(e); it.bad = true; }
        finally { clearTimeout(slow); if (token === actToken) $('loading').hidden = true; }
        if (token !== actToken) return false;
        if (it.bad || !engine.has(tk(it))) { toast(t('toastErrOpen')); return 'err'; }
        useKey = tk(it);
      }
    }
    if (S.mode === 'crop' && L.crop) { L.crop.leave(false); S.mode = 'adjust'; applyTabs('adjust'); }
    saveCur();
    const info = engine.use(useKey);
    L.cur = i;
    S.srcW = info.w; S.srcH = info.h; S.has = true; S.name = it.name; S.editing = false; S.comparing = false;
    $('btnCompare').classList.remove('on');
    S.adj = it.adj || zero(); S.history = it.history || []; S.future = it.future || [];
    S.ratioId = it.ratioId || 'free'; S.draft = null;
    S.geo = it.geo || defGeo(info.w, info.h);
    it.w = info.w; it.h = info.h;
    $('empty').hidden = true; $('loading').hidden = true;
    $('app').classList.remove('noimg');
    ['btnExport', 'btnCompare'].forEach((id) => ($(id).disabled = false));
    updateBtns(); syncUI(); L.resetView(); L.draw();
    L.hooks.items();
    if (it.big && !it.toasted) { it.toasted = true; toast(t('toastBig')); }
    view.style.transition = 'none'; view.style.transform = ''; view.style.opacity = '';
    if (dir && view.animate) view.animate(
      [{ transform: 'translateX(' + (dir * 44) + 'px)', opacity: 0.2 }, { transform: 'none', opacity: 1 }],
      { duration: 260, easing: 'cubic-bezier(.22,1,.36,1)' });
    if (partial) {
      loadFull(it).then(() => {
        if (token !== actToken || items[L.cur] !== it || !engine.has(tk(it))) return;
        engine.use(tk(it)); engine.drop(pk(it)); L.draw();
      }).catch((e) => console.error(e));
    }
    evict(); preloadSoon();
    return true;
  }
  L.activate = (i) => activate(i, i > L.cur ? 1 : -1);
  L.go = (d) => {
    const n = L.cur + d;
    if (n < 0 || n >= items.length) return false;
    activate(n, d); return true;
  };

  /* Cua en segon pla: vista prèvia + miniatura de les fotos que encara no en tenen */
  let bgBusy = false;
  async function runBg() {
    if (bgBusy) return; bgBusy = true;
    try {
      let it;
      while ((it = items.find((x) => !x.prev && !x.bad && !x.loading))) {
        try {
          const bmp = await decodeFile(it.file);
          try { if (items.includes(it)) fillFromBitmap(it, bmp); } finally { if (bmp.close) bmp.close(); }
        } catch (e) { it.bad = true; if (items[L.cur] !== it) { dropItem(it); toast(t('toastErrOpen')); } }
        await new Promise((r) => setTimeout(r, 40));
      }
    } finally { bgBusy = false; }
  }
  L.runBg = runBg;

  /* Treu del lot una foto que no s'ha pogut obrir (fitxer corrupte o format no compatible) */
  function dropItem(it) {
    const i = items.indexOf(it); if (i < 0) return;
    items.splice(i, 1); if (i < L.cur) L.cur--;
    LumenStore.delFile(it.id); engine.drop(tk(it)); engine.drop(pk(it));
    L.hooks.items();
  }
  function newItem(file, id, name) {
    return { id, file, name: name || (file.name || 'foto').replace(/\.[^.]+$/, '') || 'foto',
      adj: null, geo: null, history: [], future: [], ratioId: 'free', prev: null, thumb: '', w: 0, h: 0, bad: false, loading: null };
  }
  async function addFiles(files) {
    if (!engine) { toast(t('toastNoGL')); return; }
    const list = [...files].filter((f) => f && (f.type || '').startsWith('image/'));
    if (!list.length) { toast(t('toastErrOpen')); return; }
    await L.ensureFolder();
    if (L.home) L.home.close();
    const first = items.length;
    list.forEach((f) => { const it = newItem(f, nid++); items.push(it); LumenStore.putFile(it.id, f, f.name || it.name, f.type); });
    LumenStore.persist();
    L.hooks.items();
    let res = 'err', k = first;
    while (res === 'err' && k < items.length) { res = await activate(k); if (res === 'err') dropItem(items[k]); else k++; }
    runBg();
    if (list.length > 1) toast(t('toastAdded').replace('{n}', list.length));
    L.persistNow();
  }
  L.addFiles = addFiles;
  L.loadFile = (f) => addFiles([f]);

  function showEmpty() {
    actToken++;
    S.has = false; S.mode = 'adjust'; applyTabs('adjust'); L.cur = -1;
    $('empty').hidden = false; $('app').classList.add('noimg');
    ['btnExport', 'btnCompare', 'btnUndo', 'btnRedo'].forEach((id) => ($(id).disabled = true));
    ctx.clearRect(0, 0, view.width, view.height); amb.width = amb.width;
    shadowEl.style.opacity = 0;
    sheet.hidden = true;
    engine.keys().forEach((k) => engine.drop(k));
    L.hooks.items();
  }
  L.removeCur = async () => {
    if (L.cur < 0) return;
    const i = L.cur, gone = items[i]; items.splice(i, 1); L.cur = -1; actToken++;
    LumenStore.delFile(gone.id);
    engine.drop(tk(gone)); engine.drop(pk(gone));
    S.has = false;
    if (!items.length) { showEmpty(); L.persistNow(); return; }
    let res = 'err', k = Math.min(i, items.length - 1);
    while (res === 'err' && items.length) { const bi = Math.min(k, items.length - 1); res = await activate(bi); if (res === 'err') dropItem(items[bi]); }
    if (!items.length) showEmpty();
    toast(t('toastRemoved')); L.persistNow();
  };
  L.clearAll = async () => {
    const ids = items.map((x) => x.id);
    resetRuntime(); await LumenStore.delFiles(ids);
    await L.persistNow(); toast(t('toastCleared'));
  };

  const fileIn = $('fileIn');
  const openDlg = () => fileIn.click();
  L.openDlg = openDlg;
  $('btnOpen').addEventListener('click', openDlg);
  $('btnOpen2').addEventListener('click', openDlg);
  fileIn.addEventListener('change', () => { if (fileIn.files.length) addFiles(fileIn.files); fileIn.value = ''; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('drag'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', (e) => {
    const fs = e.clipboardData ? [...e.clipboardData.files].filter((f) => f.type.startsWith('image/')) : [];
    if (fs.length) addFiles(fs);
  });

  /* ---------- Carpetes + desat (IndexedDB) ----------
     Cada carpeta (p. ex. un partit) té el seu lot de fotos amb ajustos, retalls i historial propis.
     Només la carpeta activa és a memòria; la resta viu a IndexedDB i es carrega en obrir-la. */
  const folders = (L.folders = []);
  let activeId = null, nfid = 1, sigSaved = '', saveTimer = 0;
  L.activeFolder = () => folders.find((f) => f.id === activeId) || null;
  const todayISO = () => { const d = new Date(), z = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
  L.todayISO = todayISO;
  const saveIndex = () => LumenStore.setMeta('index', { v: 2, folders, active: activeId, nid, nfid });

  const sessionSig = () => activeId + '|' + L.cur + '|' + items.length + '|' + (S.has ? JSON.stringify(S.adj) + JSON.stringify(S.geo) + S.history.length + '/' + S.future.length : '') +
    '|' + JSON.stringify(L.getClip ? L.getClip() : null) + '|' + items.map((x) => x.id + (x === items[L.cur] ? '' : (x.history ? x.history.length : 0)) + (x.adj ? 'a' : '')).join(',');
  function buildMeta() {
    saveCur();
    return { v: 2, cur: L.cur, clip: L.getClip ? L.getClip() : null,
      items: items.map((x) => ({ id: x.id, name: x.name, adj: x.adj, geo: x.geo, ratioId: x.ratioId, w: x.w, h: x.h,
        history: (x.history || []).slice(-60), future: (x.future || []).slice(-30) })) };
  }
  /* Portada de la carpeta: la primera foto, en mida mitjana */
  function coverOf(it) {
    if (!it || !it.prev) return '';
    if (it.cover && it.coverId === it.id) return it.cover;
    const W = 420, k = Math.min(1, W / it.prev.width), c = document.createElement('canvas');
    c.width = Math.round(it.prev.width * k); c.height = Math.round(it.prev.height * k);
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(it.prev, 0, 0, c.width, c.height);
    it.cover = c.toDataURL('image/jpeg', 0.72); it.coverId = it.id; return it.cover;
  }
  L.persistNow = () => {
    clearTimeout(saveTimer); saveTimer = 0;
    const f = L.activeFolder();
    if (!f) return saveIndex();
    f.count = items.length; f.updated = Date.now();
    const cv = coverOf(items[0]); if (cv) f.cover = cv; else if (!items.length) f.cover = '';
    sigSaved = sessionSig();
    return Promise.all([LumenStore.setMeta('f' + f.id, buildMeta()), saveIndex()]);
  };
  function persistCheck() {
    if (activeId == null) return;
    if (sessionSig() !== sigSaved && !saveTimer) saveTimer = setTimeout(L.persistNow, 700);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && activeId != null) L.persistNow(); });
  window.addEventListener('pagehide', () => { if (activeId != null) L.persistNow(); });

  /* Buida l'estat d'edició en memòria (no toca res del que hi ha desat) */
  function resetRuntime() {
    actToken++; clearTimeout(saveTimer); saveTimer = 0;
    items.splice(0, items.length); L.cur = -1;
    S.history = []; S.future = []; S.draft = null;
    if (L.setClip) L.setClip(null);
    showEmpty();
  }
  async function openFolder(id, force) {
    if (id === activeId && !force) return true;
    const f = folders.find((x) => x.id === id); if (!f) return false;
    if (activeId != null && !force) await L.persistNow();
    resetRuntime();
    activeId = id; sigSaved = '';
    const meta = (await LumenStore.getMeta('f' + id)) || { items: [], cur: 0 };
    const files = await LumenStore.getFiles(meta.items.map((m) => m.id));
    if (activeId !== id) return false;
    meta.items.forEach((m) => {
      const rec = files[m.id]; if (!rec) return;
      const it = newItem(rec.blob, m.id, m.name);
      it.adj = m.adj || null; it.geo = m.geo || null; it.history = m.history || []; it.future = m.future || [];
      it.ratioId = m.ratioId || 'free'; it.w = m.w || 0; it.h = m.h || 0;
      items.push(it);
    });
    if (L.setClip) L.setClip(meta.clip || null);
    L.hooks.items();
    let ok = false;
    if (items.length) {
      let k = Math.min(Math.max(meta.cur || 0, 0), items.length - 1), res = 'err';
      while (res === 'err' && k < items.length) { res = await activate(k); if (res === 'err') dropItem(items[k]); }
      ok = res === true;
      if (!ok) showEmpty();
      runBg();
    }
    sigSaved = sessionSig(); saveIndex();
    L.hooks.folder();
    return true;
  }
  L.openFolder = openFolder;
  async function createFolder(name, date) {
    const f = { id: nfid++, name: (name || '').trim() || 'Carpeta nova', date: date || todayISO(), count: 0, cover: '', updated: Date.now() };
    folders.unshift(f); await saveIndex();
    await openFolder(f.id);
    return f;
  }
  L.createFolder = createFolder;
  L.renameFolder = async (id, name, date) => {
    const f = folders.find((x) => x.id === id); if (!f) return;
    f.name = (name || '').trim() || f.name; f.date = date || f.date; await saveIndex(); L.hooks.folder();
  };
  L.deleteFolder = async (id) => {
    const f = folders.find((x) => x.id === id); if (!f) return;
    const meta = await LumenStore.getMeta('f' + id);
    if (meta && meta.items.length) await LumenStore.delFiles(meta.items.map((m) => m.id));
    await LumenStore.delMeta('f' + id);
    folders.splice(folders.indexOf(f), 1);
    if (activeId === id) { activeId = null; resetRuntime(); }
    await saveIndex(); L.hooks.folder();
  };
  /* Afegeix fotos a la carpeta activa (en crea una automàticament si encara no n'hi ha cap) */
  L.ensureFolder = async () => {
    if (activeId != null) return;
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    await createFolder(t('folderAuto') + ' ' + z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2));
  };

  async function restoreSession() {
    let index = await LumenStore.getMeta('index');
    if (!index) {                                        // migració de la versió anterior (una sola sessió)
      const old = await LumenStore.getMeta('session');
      if (old && old.items && old.items.length) {
        const f = { id: 1, name: t('folderOld'), date: todayISO(), count: old.items.length, cover: '', updated: Date.now() };
        await LumenStore.setMeta('f1', { v: 2, cur: old.cur, clip: old.clip, items: old.items });
        index = { v: 2, folders: [f], active: 1, nid: old.nid || 1, nfid: 2 };
        await LumenStore.setMeta('index', index); await LumenStore.delMeta('session');
      }
    }
    if (!index) return;
    folders.splice(0, folders.length, ...(index.folders || []));
    nid = Math.max(index.nid || 1, nid); nfid = index.nfid || (Math.max(0, ...folders.map((x) => x.id)) + 1);
    if (index.active != null && folders.some((f) => f.id === index.active)) {
      await openFolder(index.active, true);
      if (items.length) toast(t('toastRestored').replace('{n}', items.length));
    } else if (folders.length) L.hooks.openLibrary();
    L.hooks.folder();
  }
  L.restoreSession = restoreSession;

  /* ---------- Exportació ---------- */
  const sheet = $('sheet');
  const EXP = { fmt: 'jpeg', q: 92, size: 'orig', scope: 'one' };
  const MIME = { jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
  const EXT = { jpeg: 'jpg', png: 'png', webp: 'webp' };
  function outSizeFor(c) {
    const cw = Math.round(c.w), ch = Math.round(c.h), long = Math.max(cw, ch);
    let k = EXP.size === 'orig' ? 1 : Math.min(1, EXP.size / long);
    let limited = false;
    if (long * k > engine.maxOut) { k = engine.maxOut / long; limited = true; }
    return { w: Math.max(1, Math.round(cw * k)), h: Math.max(1, Math.round(ch * k)), limited };
  }
  const outSize = () => outSizeFor(S.geo.crop);
  const batchScope = () => EXP.scope === 'all' && items.length > 1;
  function fillSizes() {
    const c = S.geo.crop, long = Math.round(Math.max(c.w, c.h)), sel = $('sizeSel'), all = batchScope();
    sel.innerHTML = '';
    const opts = [['orig', all ? t('fullSize') : t('fullSize') + ' (' + Math.round(c.w) + '×' + Math.round(c.h) + ')']];
    [4096, 2048, 1080].forEach((n) => { if (all || n < long) opts.push([String(n), n + ' px · ' + t('longSide')]); });
    opts.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); });
    if (!opts.some(([v]) => v === String(EXP.size))) EXP.size = 'orig';
    sel.value = String(EXP.size);
  }
  function updExportInfo() {
    const o = outSize(), all = batchScope();
    $('sheetTitle').textContent = t(all ? 'exportLotTitle' : 'exportTitle');
    $('btnExpGo').textContent = t(all ? 'saveZip' : 'save');
    $('exportInfo').textContent = all ? items.length + ' ' + t('photosZip') + (EXP.fmt === 'png' ? ' · ' + t('hintPng') : '') : o.w + '×' + o.h + ' px · ' + (o.w * o.h / 1e6).toFixed(1) + ' ' + t('mpx') +
      (EXP.fmt === 'png' ? ' · ' + t('hintPng') : '') + (o.limited ? ' · ' + t('hintLimit') : '');
    $('qField').hidden = EXP.fmt === 'png';
  }
  function openExport() {
    if (!S.has) return;
    if (S.mode === 'crop') setMode('adjust');
    EXP.scope = 'one';
    $('scopeField').hidden = items.length < 2;
    $('scopeSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.s === 'one'));
    fillSizes(); updExportInfo(); sheet.hidden = false;
  }
  const closeExport = () => { sheet.hidden = true; };
  $('btnExport').addEventListener('click', openExport);
  $('btnExpCancel').addEventListener('click', closeExport);
  sheet.addEventListener('pointerdown', (e) => { if (e.target === sheet) closeExport(); });
  $('fmtSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    EXP.fmt = b.dataset.f;
    $('fmtSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    updExportInfo();
  });
  $('scopeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    EXP.scope = b.dataset.s;
    $('scopeSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    fillSizes(); updExportInfo();
  });
  $('qSlider').addEventListener('input', (e) => { EXP.q = +e.target.value; $('qVal').textContent = EXP.q; paint(e.target); });
  $('sizeSel').addEventListener('change', (e) => { EXP.size = e.target.value === 'orig' ? 'orig' : +e.target.value; updExportInfo(); });

  async function shareOrDownload(blob, filename) {
    const file = new File([blob], filename, { type: blob.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; }
      catch (e) { if (e.name === 'AbortError') return false; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 15000);
    return true;
  }
  /* Exporta tot el lot en un ZIP: cada foto es descodifica, es renderitza amb el seu estat i es desa */
  async function exportAll() {
    saveCur();
    const keep = items[L.cur] ? engine.cur : null, files = [], used = {};
    try {
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        $('exportInfo').textContent = t('exporting') + ' ' + (i + 1) + ' / ' + items.length + '…';
        await new Promise((r) => setTimeout(r, 0));
        let key = tk(it), temp = false;
        if (!engine.has(key)) {
          const bmp = await decodeFile(it.file);
          try { engine.load('_x', bmp); } finally { if (bmp.close) bmp.close(); }
          key = '_x'; temp = true;
        }
        const info = engine.use(key);
        const g = it.geo || defGeo(info.w, info.h), o = outSizeFor(g.crop);
        engine.render(o.w, o.h, { rot: g.rot, flipH: g.flipH, flipV: g.flipV, angle: g.angle, crop: g.crop }, it.adj || zero(), g.crop);
        let blob = await engine.toBlob(MIME[EXP.fmt], EXP.q / 100);
        if (!blob || (blob.type && blob.type !== MIME[EXP.fmt])) { if (EXP.fmt !== 'jpeg') blob = await engine.toBlob(MIME.jpeg, EXP.q / 100); }
        if (temp) engine.drop('_x');
        if (!blob) throw new Error('blob');
        const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : 'jpg';
        const base = it.name + '-lumen'; used[base] = (used[base] || 0) + 1;
        files.push({ name: base + (used[base] > 1 ? '-' + used[base] : '') + '.' + ext, data: new Uint8Array(await blob.arrayBuffer()) });
      }
      return LumenZip.make(files);
    } finally { if (keep && engine.has(keep)) engine.use(keep); }
  }

  $('btnExpGo').addEventListener('click', async () => {
    const btn = $('btnExpGo'); btn.disabled = true;
    try {
      if (batchScope()) {
        const zip = await exportAll();
        closeExport();
        if (await shareOrDownload(zip, 'lumen-lot.zip')) toast(t('toastZip'));
        return;
      }
      const o = outSize(), g = S.geo;
      let fmt = EXP.fmt;
      engine.render(o.w, o.h, { rot: g.rot, flipH: g.flipH, flipV: g.flipV, angle: g.angle, crop: g.crop }, S.adj, g.crop);
      let blob = await engine.toBlob(MIME[fmt], EXP.q / 100);
      if (!blob || (blob.type && blob.type !== MIME[fmt])) {
        if (fmt !== 'jpeg') { fmt = 'jpeg'; blob = await engine.toBlob(MIME.jpeg, EXP.q / 100); }
      }
      if (!blob) throw new Error('blob');
      closeExport();
      const ok = await shareOrDownload(blob, S.name + '-lumen.' + EXT[fmt]);
      if (ok) toast(t('toastSaved'));
    } catch (e) { console.error(e); toast(t('toastErrExport')); }
    finally { btn.disabled = false; L.draw(); }
  });

  /* ---------- Dreceres de teclat ---------- */
  window.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (!sheet.hidden) { if (e.key === 'Escape') closeExport(); return; }
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (!mod && !e.repeat && k === 'o') openDlg();
    else if (!mod && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) === false && e.key === 'ArrowRight') L.go(1);
    else if (!mod && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) === false && e.key === 'ArrowLeft') L.go(-1);
    else if (!mod && !e.repeat && k === 'c') setCompare(true);
  });
  window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() === 'c') setCompare(false); });
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);

  /* ---------- Fletxes de pas fi (◀ ▶) als lliscadors: ±1 amb repetició en mantenir premut ---------- */
  function wireNudge(sl, bl, br, step) {
    const fire = (dir) => {
      const min = +sl.min, max = +sl.max, st = step || +sl.step || 1;
      const v = Math.round((+sl.value + dir * st) / st) * st;
      sl.value = clamp(+v.toFixed(4), min, max);
      sl.dispatchEvent(new Event('input', { bubbles: true }));
    };
    [[bl, -1], [br, 1]].forEach(([btn, dir]) => {
      let t0 = 0, t1 = 0, held = false;
      const stop = () => { clearTimeout(t0); clearInterval(t1); if (held) { held = false; sl.dispatchEvent(new Event('change', { bubbles: true })); } };
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); if (!S.has) return;
        held = true; fire(dir);
        t0 = setTimeout(() => { t1 = setInterval(() => fire(dir), 55); }, 380);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(dir); sl.dispatchEvent(new Event('change', { bubbles: true })); } });
    });
  }
  wireNudge($('adjSlider'), $('nudgeAL'), $('nudgeAR'), 1);
  wireNudge($('angleSlider'), $('nudgeGL'), $('nudgeGR'), 0.1);

  /* ---------- Inici ---------- */
  stage.dataset.drop = t('dropHere');
  I18N.apply();
  select('brightness');
  document.querySelectorAll('input[type=range]').forEach(paint);
  const ro = new ResizeObserver(() => L.draw());
  [stage, dock, bar].forEach((el) => ro.observe(el));
  window.addEventListener('orientationchange', () => setTimeout(L.draw, 200));
  L.restoreSession().catch((e) => console.warn('restore', e)).finally(() => { if (L.home) L.home.open(); });
})();

</script>
<script>/* js/crop.js */
/* Lumen — eina de retall: caixa amb tiradors, relacions d'aspecte, endreçar, girar i voltejar. */
(function () {
  'use strict';
  const L = window.L, S = L.S, G = window.LumenGeo, t = L.t;
  const $ = (id) => document.getElementById(id);
  const layer = $('cropLayer');

  const RATIOS = [
    { id: 'free' }, { id: 'orig' }, { id: '1:1', v: 1 }, { id: '4:5', v: 4 / 5 }, { id: '5:4', v: 5 / 4 },
    { id: '3:4', v: 3 / 4 }, { id: '4:3', v: 4 / 3 }, { id: '2:3', v: 2 / 3 }, { id: '3:2', v: 3 / 2 },
    { id: '9:16', v: 9 / 16 }, { id: '16:9', v: 16 / 9 }
  ];
  function ratioValue() {
    const r = RATIOS.find((x) => x.id === S.ratioId);
    if (!r || r.id === 'free') return null;
    if (r.id === 'orig') { const f = L.frame(); return f.w / f.h; }
    return r.v;
  }

  /* ---------- DOM de la capa ---------- */
  const shades = [0, 1, 2, 3].map(() => { const d = document.createElement('div'); d.className = 'shade'; return d; });
  const box = document.createElement('div'); box.className = 'box';
  const HANDLES = ['tl', 't', 'tr', 'r', 'br', 'b', 'bl', 'l'];
  const hEls = {};
  layer.append(...shades, box);
  HANDLES.forEach((h) => { const d = document.createElement('div'); d.className = 'h'; d.dataset.h = h; hEls[h] = d; layer.appendChild(d); });

  /* ---------- Xips de relació d'aspecte ---------- */
  const ratioChips = $('ratioChips');
  RATIOS.forEach((r) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.id = r.id;
    b.textContent = r.id === 'free' ? t('ratio_free') : r.id === 'orig' ? t('ratio_orig') : r.id;
    b.addEventListener('click', () => {
      S.ratioId = r.id; markRatios();
      const v = ratioValue();
      if (v && S.draft) {
        const f = L.frame(), d = S.draft;
        S.draft = G.fitRatio({ x: d.x + d.w / 2, y: d.y + d.h / 2 }, v, f.w, f.h, S.geo.angle);
      }
      L.draw();
    });
    ratioChips.appendChild(b);
  });
  function markRatios() { ratioChips.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.id === S.ratioId)); }

  /* ---------- Posició de la caixa a pantalla ---------- */
  function sync() {
    if (layer.hidden || !S.draft) return;
    const sw = layer.clientWidth, sh = layer.clientHeight, d = S.draft;
    const a = L.toScreen(d.x, d.y), b = L.toScreen(d.x + d.w, d.y + d.h);
    const px = (el, l, tp, w, h) => { el.style.left = l + 'px'; el.style.top = tp + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; };
    px(box, a.x, a.y, b.x - a.x, b.y - a.y);
    px(shades[0], 0, 0, sw, Math.max(0, a.y));
    px(shades[1], 0, b.y, sw, Math.max(0, sh - b.y));
    px(shades[2], 0, a.y, Math.max(0, a.x), b.y - a.y);
    px(shades[3], b.x, a.y, Math.max(0, sw - b.x), b.y - a.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const pos = { tl: [a.x, a.y], t: [mx, a.y], tr: [b.x, a.y], r: [b.x, my], br: [b.x, b.y], b: [mx, b.y], bl: [a.x, b.y], l: [a.x, my] };
    HANDLES.forEach((h) => { hEls[h].style.left = pos[h][0] + 'px'; hEls[h].style.top = pos[h][1] + 'px'; });
  }

  /* ---------- Arrossegar: moure i redimensionar ---------- */
  function startDrag(e, mode) {
    e.preventDefault(); e.stopPropagation();
    const el = e.currentTarget;
    el.setPointerCapture(e.pointerId);
    const c0 = Object.assign({}, S.draft), x0 = e.clientX, y0 = e.clientY, sc = L.scale(), f = L.frame(), ratio = ratioValue(), ang = S.geo.angle;
    const mv = (ev) => {
      const dx = (ev.clientX - x0) / sc, dy = (ev.clientY - y0) / sc;
      S.draft = mode === 'move' ? G.moveCrop(c0, dx, dy, f.w, f.h, ang) : G.resizeCrop(c0, mode, dx, dy, ratio, f.w, f.h, ang);
      L.draw();
    };
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  box.addEventListener('pointerdown', (e) => startDrag(e, 'move'));
  HANDLES.forEach((h) => hEls[h].addEventListener('pointerdown', (e) => startDrag(e, h)));

  /* ---------- Entrar / sortir / confirmar ---------- */
  function commit() {
    const d = S.draft, c = S.geo.crop;
    if (!d) return false;
    let r = { x: d.x, y: d.y, w: d.w, h: d.h };
    if (S.geo.angle !== 0) r = { x: r.x + 1, y: r.y + 1, w: r.w - 2, h: r.h - 2 };   // marge per evitar vora transparent en girar
    const x = Math.round(r.x), y = Math.round(r.y);
    r = { x, y, w: Math.max(1, Math.round(r.w)), h: Math.max(1, Math.round(r.h)) };
    if (Math.abs(r.x - c.x) < 1 && Math.abs(r.y - c.y) < 1 && Math.abs(r.w - c.w) < 1 && Math.abs(r.h - c.h) < 1) return false;
    L.push(); S.geo.crop = r; return true;
  }
  function enter() {
    S.draft = Object.assign({}, S.geo.crop);
    layer.hidden = false; syncUI(); sync();
  }
  function leave(apply) {
    if (apply) commit();
    S.draft = null; layer.hidden = true;
  }
  function syncUI() {
    const a = S.geo.angle || 0;
    $('angleSlider').value = a; L.paint($('angleSlider'));
    $('angleVal').textContent = (a > 0 ? '+' : '') + a.toFixed(1) + '°';
    markRatios();
  }

  /* ---------- Girar, voltejar, endreçar ---------- */
  function op(name) {
    const f = L.frame();
    L.push();
    S.geo.crop = G.transformCrop(S.geo.crop, f.w, f.h, name);
    if (S.draft) S.draft = G.transformCrop(S.draft, f.w, f.h, name);
    const g = G.applyOp(S.geo, name);
    S.geo.rot = g.rot; S.geo.flipH = g.flipH; S.geo.flipV = g.flipV;
    if (name === 'flipH' || name === 'flipV') S.geo.angle = -S.geo.angle;     // el llindar d'inclinació es mira al mirall
    if (name === 'rotR' || name === 'rotL') {                                  // 4:5 <-> 5:4
      const m = /^(\d+):(\d+)$/.exec(S.ratioId);
      if (m) S.ratioId = m[2] + ':' + m[1];
    }
    syncUI(); L.resetView(); L.draw();
  }
  $('btnRotR').addEventListener('click', () => op('rotR'));
  $('btnRotL').addEventListener('click', () => op('rotL'));
  $('btnFlipH').addEventListener('click', () => op('flipH'));
  $('btnFlipV').addEventListener('click', () => op('flipV'));

  const angleSlider = $('angleSlider');
  angleSlider.addEventListener('input', () => {
    if (!S.has) return;
    if (!S.editing) { L.push(); S.editing = true; }
    const a = parseFloat(angleSlider.value) || 0, f = L.frame();
    S.geo.angle = a; L.paint(angleSlider);
    S.geo.crop = G.shrinkToFit(S.geo.crop, f.w, f.h, a);
    if (S.draft) S.draft = G.shrinkToFit(S.draft, f.w, f.h, a);
    $('angleVal').textContent = (a > 0 ? '+' : '') + a.toFixed(1) + '°';
    L.draw();
  });
  angleSlider.addEventListener('change', () => { S.editing = false; });
  angleSlider.addEventListener('dblclick', () => { angleSlider.value = 0; angleSlider.dispatchEvent(new Event('input')); angleSlider.dispatchEvent(new Event('change')); });

  $('btnCropReset').addEventListener('click', () => {
    if (!S.has) return;
    L.push();
    S.geo = { rot: 0, flipH: false, flipV: false, angle: 0, crop: { x: 0, y: 0, w: S.srcW, h: S.srcH } };
    S.draft = Object.assign({}, S.geo.crop); S.ratioId = 'free';
    syncUI(); L.resetView(); L.draw();
  });

  L.crop = { enter, leave, sync, syncUI };
  markRatios();
})();

</script>
<script>/* js/batch.js */
/* Lumen — interfície del lot: tira de miniatures, panell «Lot» (copiar / enganxar / aplicar a totes / seleccionar). */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const L = window.L, S = L.S, t = L.t, items = L.items;
  const strip = $('strip');
  let clip = null;            // ajustos copiats (també es desen amb la sessió)
  let selMode = false;        // mode de selecció múltiple
  const picked = new Set();   // ids de les fotos marcades

  const ADJ_KEYS = Object.keys(L.zero());
  const hasAdj = (adj) => !!adj && ADJ_KEYS.some((k) => Math.abs(adj[k] || 0) > 1e-6);
  function geoEdited(g, w, h) {
    if (!g) return false;
    const c = g.crop;
    return g.rot !== 0 || g.flipH || g.flipV || Math.abs(g.angle) > 1e-6 ||
      (w > 0 && (Math.abs(c.w - w) > 0.5 || Math.abs(c.h - h) > 0.5 || Math.abs(c.x) > 0.5 || Math.abs(c.y) > 0.5));
  }
  const isEdited = (it, i) => i === L.cur
    ? hasAdj(S.adj) || geoEdited(S.geo, S.srcW, S.srcH)
    : hasAdj(it.adj) || geoEdited(it.geo, it.w, it.h);

  /* ---------- Tira ---------- */
  function render() {
    strip.hidden = items.length < 2;
    strip.classList.toggle('sel', selMode);
    strip.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.className = 'th'; b.dataset.id = it.id; b.dataset.i = i;
      b.setAttribute('aria-label', (i + 1) + ' / ' + items.length + ' · ' + it.name);
      const img = document.createElement('img'); img.alt = '';
      if (it.thumb && it.thumb.startsWith('data:')) img.src = it.thumb;
      b.append(img);
      b.insertAdjacentHTML('beforeend', '<span class="ed"></span><span class="ck"></span><span class="num">' + (i + 1) + '</span>');
      strip.appendChild(b);
    });
    mark();
    info();
    const cur = strip.children[L.cur];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
  function mark() {
    [...strip.children].forEach((b, i) => {
      const it = items[i]; if (!it) return;
      b.classList.toggle('on', i === L.cur);
      b.classList.toggle('picked', picked.has(it.id));
      b.classList.toggle('edited', isEdited(it, i));
    });
  }
  /* Només repinta el puntet d'«editada» de la foto activa (es crida a cada dibuix) */
  let lastDot = null;
  function dirty() {
    const b = strip.children[L.cur]; if (!b || !items[L.cur]) return;
    const e = isEdited(items[L.cur], L.cur);
    if (lastDot !== L.cur + ':' + e) { lastDot = L.cur + ':' + e; b.classList.toggle('edited', e); }
  }
  function thumb(it) {
    const i = items.indexOf(it), b = strip.children[i]; if (!b) return;
    if (it.thumb.startsWith('data:')) b.querySelector('img').src = it.thumb;
  }
  function info() {
    $('btnPaste').disabled = !clip;
    const n = picked.size;
    $('pasteLabel').textContent = t('pasteS') + (selMode && n ? ' ' + n : '');
    $('selLabel').textContent = t(selMode ? 'selectDone' : 'selectMode');
    $('btnSelMode').classList.toggle('on', selMode);
    $('btnSelMode').setAttribute('aria-pressed', selMode);
    $('btnApplyAll').disabled = items.length < 2;
    $('btnSelMode').disabled = items.length < 2;
  }
  L.hooks.items = () => {
    const ids = new Set(items.map((x) => x.id));
    [...picked].forEach((id) => { if (!ids.has(id)) picked.delete(id); });
    if (items.length < 2) selMode = false;
    lastDot = null; render();
  };
  L.hooks.thumb = thumb;
  L.hooks.dirty = dirty;

  /* Arrossegar la tira amb el ratolí (al mòbil ja llisca amb el dit); inèrcia suau en deixar anar */
  (function () {
    let down = false, sx = 0, sl = 0, moved = false, lastX = 0, lastT = 0, vel = 0, raf = 0;
    strip.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      down = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; lastX = e.clientX; lastT = performance.now(); vel = 0; cancelAnimationFrame(raf);
    });
    window.addEventListener('pointermove', (e) => {
      if (!down) return;
      const dx = e.clientX - sx;
      if (!moved && Math.abs(dx) > 5) { moved = true; strip.classList.add('dragging'); }
      if (moved) {
        strip.scrollLeft = sl - dx;
        const now = performance.now(); vel = (lastX - e.clientX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
      }
    });
    window.addEventListener('pointerup', () => {
      if (!down) return; down = false;
      if (!moved) return;
      setTimeout(() => strip.classList.remove('dragging'), 0);
      const glide = () => { strip.scrollLeft += vel * 16; vel *= 0.93; if (Math.abs(vel) > 0.05) raf = requestAnimationFrame(glide); };
      glide();
    });
    strip.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  })();

  strip.addEventListener('click', (e) => {
    const b = e.target.closest('.th'); if (!b) return;
    const i = +b.dataset.i, it = items[i];
    if (selMode) {
      picked.has(it.id) ? picked.delete(it.id) : picked.add(it.id);
      mark(); info();
    } else L.activate(i);
  });

  /* ---------- Panell Lot ---------- */
  const copyAdj = (a) => Object.assign({}, a);
  /* Posa uns ajustos a la foto i-èssima; deixa el pas anterior a l'historial perquè es pugui desfer */
  function applyTo(i, adj) {
    if (i === L.cur) {
      L.push(); S.adj = copyAdj(adj); L.syncUI(); L.draw();
    } else {
      const it = items[i];
      it.history.push(JSON.stringify({ adj: it.adj || L.zero(), geo: it.geo }));
      if (it.history.length > 100) it.history.shift();
      it.future = []; it.adj = copyAdj(adj);
    }
  }
  $('btnAddPhotos').addEventListener('click', () => L.openDlg());
  $('btnRemove').addEventListener('click', () => L.removeCur());
  $('btnCopy').addEventListener('click', () => {
    if (!S.has) return;
    clip = copyAdj(S.adj); info(); L.toast(t('toastCopied'));
  });
  $('btnPaste').addEventListener('click', () => {
    if (!clip) { L.toast(t('toastNoClip')); return; }
    const idx = selMode && picked.size ? items.map((x, i) => (picked.has(x.id) ? i : -1)).filter((i) => i >= 0) : [L.cur];
    idx.forEach((i) => applyTo(i, clip));
    mark(); L.toast(t('toastPasted').replace('{n}', idx.length));
  });
  $('btnApplyAll').addEventListener('click', () => {
    if (!S.has || items.length < 2) return;
    const src = copyAdj(S.adj); clip = src;
    let n = 0;
    items.forEach((it, i) => { if (i !== L.cur) { applyTo(i, src); n++; } });
    info(); mark(); L.toast(t('toastAppliedAll').replace('{n}', n));
  });
  $('btnSelMode').addEventListener('click', () => {
    selMode = !selMode; if (!selMode) picked.clear();
    strip.classList.toggle('sel', selMode); mark(); info();
  });

  /* Buida el lot: cal tocar dues vegades (evita esborrar la sessió per error) */
  let clearT = 0;
  $('btnClear').addEventListener('click', () => {
    if (!clearT) {
      $('clearLabel').textContent = t('clearSure');
      clearT = setTimeout(() => { clearT = 0; $('clearLabel').textContent = t('clearLot'); }, 3000);
      return;
    }
    clearTimeout(clearT); clearT = 0; $('clearLabel').textContent = t('clearLot');
    picked.clear(); selMode = false; L.clearAll();
  });
  L.applyAdjTo = applyTo;
  L.markStrip = mark;
  L.getClip = () => clip;
  L.setClip = (c) => { clip = c || null; info(); };

  info();
})();

</script>
<script>/* js/library.js */
/* Lumen — biblioteca de carpetes: cada carpeta agrupa un lot de fotos editades (p. ex. un partit).
   Crear, importar des del dispositiu, obrir, canviar el nom i eliminar. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const L = window.L, t = L.t;
  const lib = $('library'), grid = $('libGrid');

  const fmtDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : ''; };
  const nPhotos = (n) => (n === 1 ? t('photoN1') : t('photosN').replace('{n}', n));
  const svg = (id) => '<svg class="ic" aria-hidden="true"><use href="#i-' + id + '"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Diàleg (nom + data) ---------- */
  function ask(title, name, date, opts) {
    opts = opts || {};
    return new Promise((res) => {
      const dlg = $('dlg'), nm = $('dlgName'), dt = $('dlgDate');
      $('dlgDateField').hidden = !!opts.noDate; $('dlgNameLabel').textContent = t(opts.nameLabel || 'folderName'); nm.placeholder = opts.placeholder || 'JA vs Rioollet';
      $('dlgTitle').textContent = title; nm.value = name || ''; dt.value = date || L.todayISO();
      dlg.hidden = false; setTimeout(() => nm.focus(), 60);
      const done = (v) => { dlg.hidden = true; $('dlgForm').onsubmit = null; $('dlgCancel').onclick = null; dlg.onpointerdown = null; res(v); };
      $('dlgForm').onsubmit = (e) => { e.preventDefault(); done({ name: nm.value.trim(), date: dt.value }); };
      $('dlgCancel').onclick = () => done(null);
      dlg.onpointerdown = (e) => { if (e.target === dlg) done(null); };
    });
  }

  L.ask = ask;

  /* ---------- Llista ---------- */
  function sorted() {
    return [...L.folders].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.updated - a.updated);
  }
  function render() {
    grid.innerHTML = '';
    const act = L.activeFolder();
    const nb = document.createElement('button');
    nb.className = 'fcard new'; nb.innerHTML = '<span class="plus">' + svg('folder-plus') + '</span><span class="fname" >' + esc(t('newFolder')) + '</span>';
    nb.addEventListener('click', newFolder);
    grid.appendChild(nb);
    sorted().forEach((f, i) => {
      const c = document.createElement('div');
      c.className = 'fcard' + (act && act.id === f.id ? ' open' : ''); c.dataset.id = f.id; c.tabIndex = 0; c.setAttribute('role', 'button');
      c.style.setProperty('--d', (i * 40) + 'ms');
      c.innerHTML =
        '<div class="cover">' + (f.cover ? '<img alt="" src="' + f.cover + '">' : '<span class="ph">' + svg('folder') + '</span>') +
        (act && act.id === f.id ? '<span class="tag">' + esc(t('openNow')) + '</span>' : '') + '</div>' +
        '<div class="finfo"><div class="fname">' + esc(f.name) + '</div><div class="fmeta">' + esc(nPhotos(f.count || 0)) + (f.date ? ' · ' + fmtDate(f.date) : '') + '</div></div>' +
        '<div class="facts"><button class="mini" data-act="ren" aria-label="' + esc(t('tipRename')) + '" title="' + esc(t('tipRename')) + '">' + svg('pencil') + '</button>' +
        '<button class="mini" data-act="del" aria-label="' + esc(t('tipDelete')) + '" title="' + esc(t('tipDelete')) + '">' + svg('trash-2') + '</button></div>';
      grid.appendChild(c);
    });
    $('libEmpty').hidden = L.folders.length > 0;
  }
  L.hooks.folder = () => { if (!lib.hidden) render(); };

  grid.addEventListener('click', async (e) => {
    const card = e.target.closest('.fcard'); if (!card || card.classList.contains('new')) return;
    const id = +card.dataset.id, f = L.folders.find((x) => x.id === id); if (!f) return;
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'ren') {
      const r = await ask(t('renameTitle'), f.name, f.date); if (r) await L.renameFolder(id, r.name, r.date);
    } else if (act && act.dataset.act === 'del') {
      if (!act.classList.contains('arm')) {
        act.classList.add('arm'); act.innerHTML = '<span>' + esc(t('delSure')) + '</span>';
        setTimeout(() => { if (act.isConnected) { act.classList.remove('arm'); act.innerHTML = svg('trash-2'); } }, 3000);
      } else { await L.deleteFolder(id); L.toast(t('toastFolderDeleted')); render(); }
    } else {
      await L.openFolder(id); done();
    }
  });
  grid.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('fcard') && !e.target.classList.contains('new')) e.target.click(); });

  async function newFolder() {
    const r = await ask(t('newFolderTitle'), '', L.todayISO()); if (!r) return;
    await L.createFolder(r.name || t('folderAuto'), r.date);
    done(); setTimeout(() => $('fileIn').click(), 0);       // directament a triar les fotos
  }

  /* Importar una carpeta sencera del dispositiu (Chrome d'escriptori); al mòbil s'obre el selector de fotos */
  $('libImport').addEventListener('click', () => $('dirIn').click());
  $('dirIn').addEventListener('change', async () => {
    const files = [...$('dirIn').files].filter((f) => (f.type || '').startsWith('image/'));
    const rel = $('dirIn').files[0] && $('dirIn').files[0].webkitRelativePath;
    $('dirIn').value = '';
    if (!files.length) { L.toast(t('toastNoImgs')); return; }
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    let name = rel ? rel.split('/')[0] : '';
    if (!name) { const r = await ask(t('newFolderTitle'), '', L.todayISO()); if (!r) return; name = r.name; await L.createFolder(name || t('folderAuto'), r.date); }
    else await L.createFolder(name, L.todayISO());
    done(); await L.addFiles(files);
  });

  /* ---------- Obrir / tancar ---------- */
  function open() { render(); lib.hidden = false; lib.classList.remove('in'); void lib.offsetWidth; lib.classList.add('in'); }
  function close() { lib.hidden = true; }
  function done() { lib.hidden = true; if (L.home) L.home.close(); }   // acció feta: es tanca també l'inici
  L.library = { open, close, newFolder };
  L.hooks.openLibrary = open;
  $('btnFolder').addEventListener('click', open);
  $('libClose').addEventListener('click', close);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('dlg').hidden) $('dlgCancel').click(); else if (!lib.hidden) close(); } });
})();

</script>
<script>/* js/styles.js */
/* Lumen — estils desats. Un estil és un conjunt d'ajustos de color amb nom (no inclou retall ni gir).
   Es desen al dispositiu, s'apliquen amb un toc (a la foto o a tot el lot) i s'importen/exporten en JSON.

   Format del fitxer (el mateix que farà servir l'extracció d'estil a partir d'una foto de referència):
   { "lumen": 1, "type": "style", "name": "Cinema", "created": "2026-10-23", "source": "manual",
     "adj": { "brightness": -0.05, "contrast": 0.2, "saturation": -0.1, "ambience": 0.1, "highlights": -0.2,
              "shadows": 0.15, "warmth": 0.1, "tint": 0, "sharpen": 0.2, "vignette": -0.2 } }
   Valors entre -1 i 1 (nitidesa entre 0 i 1). Diversos estils: { "lumen": 1, "type": "styles", "styles": [ ... ] } */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const L = window.L, S = L.S, t = L.t;
  const KEYS = Object.keys(L.zero());
  const strip = $('stStrip');

  /* Estils inclosos per començar (no es poden eliminar) */
  const A = (o) => Object.assign(L.zero(), o);
  const BUILTIN = [
    { id: 'b1', name: 'Natural', builtin: true, adj: A({ contrast: 0.08, saturation: 0.1, ambience: 0.15, shadows: 0.12, sharpen: 0.2 }) },
    { id: 'b2', name: 'Vius', builtin: true, adj: A({ contrast: 0.18, saturation: 0.35, ambience: 0.25, highlights: -0.15, sharpen: 0.3 }) },
    { id: 'b3', name: 'Cinema', builtin: true, adj: A({ brightness: -0.04, contrast: 0.28, saturation: -0.15, highlights: -0.25, shadows: 0.1, warmth: -0.08, tint: -0.05, vignette: -0.3 }) },
    { id: 'b4', name: 'Càlid', builtin: true, adj: A({ brightness: 0.04, contrast: 0.1, saturation: 0.12, warmth: 0.32, highlights: -0.12, vignette: -0.12 }) },
    { id: 'b5', name: 'Fred', builtin: true, adj: A({ contrast: 0.12, saturation: -0.08, warmth: -0.32, shadows: 0.08, sharpen: 0.25 }) },
    { id: 'b6', name: 'B/N', builtin: true, adj: A({ contrast: 0.3, saturation: -1, ambience: 0.2, highlights: -0.15, shadows: 0.1, sharpen: 0.3, vignette: -0.25 }) }
  ];
  let mine = [];                 // estils de l'usuari (persistits)
  let sel = null;                // id de l'estil seleccionat
  const all = () => mine.concat(BUILTIN);
  const find = (id) => all().find((s) => s.id === id);

  /* ---------- Persistència ---------- */
  const save = () => LumenStore.setMeta('styles', mine.map(({ id, name, adj, created, source }) => ({ id, name, adj, created, source })));
  const nextId = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* ---------- Validació (importació) ---------- */
  const r3 = (v) => Math.round(v * 1000) / 1000;
  function clean(o) {
    if (!o || typeof o !== 'object' || !o.adj || typeof o.adj !== 'object') return null;
    const adj = L.zero(); let any = false;
    KEYS.forEach((k) => {
      let v = Number(o.adj[k]); if (!isFinite(v)) v = 0;
      v = k === 'sharpen' ? Math.min(1, Math.max(0, v)) : Math.min(1, Math.max(-1, v));
      adj[k] = r3(v); if (v !== 0) any = true;
    });
    if (!any) return null;
    return { id: nextId(), name: String(o.name || 'Estil').slice(0, 60), adj, created: String(o.created || L.todayISO()).slice(0, 10), source: o.source === 'extracted' ? 'extracted' : 'manual' };
  }
  function parseFile(text) {
    const j = JSON.parse(text);
    if (!j || j.lumen !== 1) return [];
    const list = j.type === 'styles' && Array.isArray(j.styles) ? j.styles : j.type === 'style' ? [j] : [];
    return list.map(clean).filter(Boolean);
  }
  const toFile = (s) => ({ lumen: 1, type: 'style', name: s.name, created: s.created || L.todayISO(), source: s.source || 'manual',
    adj: Object.fromEntries(KEYS.map((k) => [k, r3(s.adj[k] || 0)])) });

  /* ---------- Miniatures: la foto actual amb cada estil aplicat ---------- */
  const thumbs = new Map();       // id -> dataURL (per a la foto actual)
  let thumbFor = '', thumbTimer = 0;
  function renderThumbs() {
    const e = L.engine, it = L.items[L.cur];
    if (!e || !e.tex || !S.has || !it) return;
    const key = it.id + ':' + e.cur + ':' + JSON.stringify(S.geo.crop);
    const want = all().map((s) => s.id + (thumbs.has(s.id) ? '' : '?')).join(',');
    if (thumbFor === key && !/\?/.test(want)) return;
    if (thumbFor !== key) thumbs.clear();
    thumbFor = key;
    const f = e.constructor.frameSize(e.srcW, e.srcH, 0), m = Math.min(f.w, f.h);
    const crop = { x: (f.w - m) / 2, y: (f.h - m) / 2, w: m, h: m };
    const geo = { rot: 0, flipH: false, flipV: false, angle: 0, crop };
    const T = 96, c = document.createElement('canvas'); c.width = c.height = T; const x = c.getContext('2d');
    all().forEach((s) => {
      if (thumbs.has(s.id)) return;
      e.render(T, T, geo, s.adj, crop); x.clearRect(0, 0, T, T); x.drawImage(e.canvas, 0, 0);
      thumbs.set(s.id, c.toDataURL('image/jpeg', 0.7));
    });
    L.draw();                                   // el motor és compartit: es torna a pintar la vista principal
    paintThumbs();
  }
  const thumbsSoon = () => { clearTimeout(thumbTimer); thumbTimer = setTimeout(() => { if (S.mode === 'styles') renderThumbs(); }, 120); };

  /* ---------- Interfície ---------- */
  const svg = (id) => '<svg class="ic" aria-hidden="true"><use href="#i-' + id + '"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const same = (a, b) => KEYS.every((k) => Math.abs((a[k] || 0) - (b[k] || 0)) < 0.005);
  function render() {
    strip.innerHTML = '';
    const mk = (cls, inner, handler, label) => {
      const b = document.createElement('button'); b.className = 'stl ' + cls; b.innerHTML = inner;
      if (label) b.setAttribute('aria-label', label); b.addEventListener('click', handler); strip.appendChild(b); return b;
    };
    mk('act', '<span class="tile">' + svg('plus') + '</span><span class="nm">' + esc(t('stNew')) + '</span>', saveCurrent);
    mk('act', '<span class="tile">' + svg('upload') + '</span><span class="nm">' + esc(t('stImport')) + '</span>', () => $('styleIn').click());
    mk('act', '<span class="tile">' + svg('image-plus') + '</span><span class="nm">' + esc(t('stRef')) + '</span>', () => $('refIn').click());
    all().forEach((s) => {
      const b = mk('', '<span class="tile"><img alt="" ' + (thumbs.has(s.id) ? 'src="' + thumbs.get(s.id) + '"' : '') + '></span><span class="nm">' + esc(s.name) + '</span>',
        () => choose(s.id), s.name);
      b.dataset.id = s.id;
    });
    paintThumbs(); mark();
  }
  function paintThumbs() {
    strip.querySelectorAll('.stl[data-id]').forEach((b) => {
      const u = thumbs.get(b.dataset.id), im = b.querySelector('img'); if (u && im && im.getAttribute('src') !== u) im.src = u;
    });
  }
  let lastSig = '';
  function mark() {
    const cur = S.has ? S.adj : null;
    strip.querySelectorAll('.stl[data-id]').forEach((b) => {
      const s = find(b.dataset.id);
      b.classList.toggle('sel', b.dataset.id === sel);
      b.classList.toggle('on', !!(cur && s && same(cur, s.adj)));
    });
    const s = find(sel);
    $('stAll').disabled = !s; $('stRename').disabled = !s || !!s.builtin; $('stDelete').disabled = !s || !!s.builtin;
  }
  L.hooks.dirty = ((prev) => () => {
    prev();
    if (S.mode !== 'styles') return;
    const sig = JSON.stringify(S.adj); if (sig !== lastSig) { lastSig = sig; mark(); }
  })(L.hooks.dirty);

  function choose(id) {
    const s = find(id); if (!s || !S.has) return;
    sel = id; L.applyAdjTo(L.cur, s.adj); L.syncUI(); lastSig = JSON.stringify(S.adj);
    mark(); L.markStrip(); L.toast(t('toastStyleApplied'));
  }
  async function saveCurrent() {
    if (!S.has) return;
    if (KEYS.every((k) => Math.abs(S.adj[k] || 0) < 1e-6)) { L.toast(t('toastNoAdj')); return; }
    const r = await L.ask(t('newStyleTitle'), '', null, { noDate: true, nameLabel: 'styleName', placeholder: 'Cinema' });
    if (!r) return;
    const s = clean({ name: r.name || 'Estil', adj: S.adj, source: 'manual' });
    mine.unshift(s); sel = s.id; thumbs.delete(s.id); await save(); render(); renderThumbs(); L.toast(t('toastStyleSaved'));
  }
  $('stRename').addEventListener('click', async () => {
    const s = find(sel); if (!s || s.builtin) return;
    const r = await L.ask(t('renameStyleTitle'), s.name, null, { noDate: true, nameLabel: 'styleName' });
    if (r && r.name) { s.name = r.name.slice(0, 60); await save(); render(); }
  });
  let delT = 0;
  $('stDelete').addEventListener('click', async () => {
    const s = find(sel); if (!s || s.builtin) return;
    if (!delT) { $('stDelLabel').textContent = t('stSure'); delT = setTimeout(() => { delT = 0; $('stDelLabel').textContent = t('stDelete'); }, 3000); return; }
    clearTimeout(delT); delT = 0; $('stDelLabel').textContent = t('stDelete');
    mine = mine.filter((x) => x.id !== s.id); sel = null; thumbs.delete(s.id); await save(); render(); L.toast(t('toastStyleDeleted'));
  });
  $('stAll').addEventListener('click', () => {
    const s = find(sel); if (!s || !S.has) return;
    L.items.forEach((it, i) => L.applyAdjTo(i, s.adj));
    L.syncUI(); lastSig = JSON.stringify(S.adj); mark(); L.markStrip(); L.toast(t('toastStyleAll').replace('{n}', L.items.length));
  });

  /* ---------- Importar / exportar JSON ---------- */
  $('styleIn').addEventListener('change', async () => {
    const files = [...$('styleIn').files]; $('styleIn').value = '';
    let added = [];
    for (const f of files) { try { added = added.concat(parseFile(await f.text())); } catch (e) { /* JSON no vàlid */ } }
    if (!added.length) { L.toast(t('toastStyleBad')); return; }
    mine = added.concat(mine); sel = added[0].id; await save(); thumbs.clear(); thumbFor = ''; render(); renderThumbs();
    L.toast(t('toastStylesImported').replace('{n}', added.length));
  });
  $('stExport').addEventListener('click', async () => {
    const s = find(sel);
    const list = s ? [s] : mine;
    if (!list.length) { L.toast(t('toastNoAdj')); return; }
    const body = list.length === 1 ? toFile(list[0]) : { lumen: 1, type: 'styles', styles: list.map(toFile) };
    const slug = list.length === 1 ? list[0].name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'estil' : 'estils';
    const blob = new Blob([JSON.stringify(body, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lumen-' + slug + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 15000);
  });

  /* ---------- Quan es mostra la pestanya / canvia la foto ---------- */
  const tab = $('tabStyles');
  tab.addEventListener('click', () => { lastSig = ''; render(); setTimeout(renderThumbs, 60); });
  const prevItems = L.hooks.items;
  L.hooks.items = () => { prevItems(); thumbFor = ''; if (S.mode === 'styles') { thumbsSoon(); } };
  /* La foto activa canvia (o s'edita el retall) => cal refer les miniatures */
  const origDraw = L.draw; let lastCrop = '';
  L.hooks.dirty = ((prev) => () => { prev(); if (S.mode === 'styles' && S.has) { const c = JSON.stringify(S.geo.crop) + L.cur; if (c !== lastCrop) { lastCrop = c; thumbsSoon(); } } })(L.hooks.dirty);

  /* ---------- Inici ---------- */
  (async () => {
    const saved = await LumenStore.getMeta('styles');
    if (Array.isArray(saved)) mine = saved.map((s) => Object.assign(clean(s) || {}, { id: s.id || nextId() })).filter((s) => s.adj);
    render();
  })();
  /* Afegeix un estil (p. ex. extret d'una foto de referència) */
  L.styles = { all, choose, mine: () => mine,
    async add(name, adj, source) {
      const s = clean({ name: name || 'Estil', adj, source: source || 'manual' }); if (!s) return null;
      mine.unshift(s); sel = s.id; thumbs.delete(s.id); await save(); render(); if (S.mode === 'styles') thumbsSoon(); return s;
    } };
})();

</script>
<script>/* js/extract.js */
/* Lumen — extracció d'estil d'una foto de referència (anàlisi automàtica, tot al dispositiu).
   S'analitza la distribució de llum i color de la referència i es tradueix als mateixos 10 ajustos d'Lumen.
   Limitació honesta: una foto acabada barreja l'estil amb el seu contingut (un capvespre és càlid per natura), per això
   els valors s'amorteixen i hi ha un control d'INTENSITAT amb previsualització abans d'aplicar o desar. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const L = window.L, S = L.S, t = L.t;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const r3 = (v) => Math.round(v * 1000) / 1000;

  /* ---------- Anàlisi ---------- */
  function analyse(data, w, h) {
    const N = w * h, Lp = new Float32Array(N), hist = new Float32Array(256);
    let sum = 0, satSum = 0, satN = 0, chromaSum = 0;
    let nr = 0, nb = 0, ng = 0, nn = 0, ar = 0, ab = 0, ag = 0;
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const r = data[p] / 255, g = data[p + 1] / 255, b = data[p + 2] / 255;
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b; Lp[i] = l; sum += l; hist[Math.min(255, (l * 255) | 0)]++;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), c = mx - mn;
      chromaSum += c; if (mx > 0.12) { satSum += c / mx; satN++; }
      ar += r; ab += b; ag += g;
      if (c < 0.2 && l > 0.12 && l < 0.92) { nr += r; nb += b; ng += g; nn++; }   // gairebé neutres: indiquen la dominant de color
    }
    const mean = sum / N; let v = 0; for (let i = 0; i < N; i++) v += (Lp[i] - mean) * (Lp[i] - mean);
    const sd = Math.sqrt(v / N);
    const pct = (q) => { let a = 0; const tgt = q * N; for (let i = 0; i < 256; i++) { a += hist[i]; if (a >= tgt) return i / 255; } return 1; };
    const useNeutral = nn > N * 0.04;
    const R = useNeutral ? nr / nn : ar / N, B = useNeutral ? nb / nn : ab / N, G = useNeutral ? ng / nn : ag / N;
    const damp = useNeutral ? 1 : 0.5;
    // caixa 3x3 i caixa gran (contrast local) amb imatge integral
    const I = new Float64Array((w + 1) * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += Lp[y * w + x]; I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + row; } }
    const box = (x, y, rad) => { const x0 = Math.max(0, x - rad), y0 = Math.max(0, y - rad), x1 = Math.min(w, x + rad + 1), y1 = Math.min(h, y + rad + 1);
      return (I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0]) / ((x1 - x0) * (y1 - y0)); };
    let edge = 0, loc = 0;
    for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) {
      const l = Lp[y * w + x]; edge += Math.abs(l - box(x, y, 1)); loc += (l - box(x, y, 7)) * (l - box(x, y, 7));
    }
    const cnt = Math.ceil((w - 2) / 2) * Math.ceil((h - 2) / 2); edge /= cnt; const lc = Math.sqrt(loc / cnt);
    // vinyeta: lluminositat del centre respecte dels racons
    const patch = (cx, cy, rr) => box(Math.round(cx * w), Math.round(cy * h), Math.round(rr * Math.min(w, h)));
    const center = patch(0.5, 0.5, 0.18), corners = (patch(0.1, 0.1, 0.1) + patch(0.9, 0.1, 0.1) + patch(0.1, 0.9, 0.1) + patch(0.9, 0.9, 0.1)) / 4;
    return { mean, sd, p5: pct(0.05), p50: pct(0.5), p95: pct(0.95), sat: satN ? satSum / satN : 0, chroma: chromaSum / N,
      warm: ((R - B) / Math.max(0.05, (R + B) / 2)) * damp, tint: ((G - (R + B) / 2) / Math.max(0.05, (R + G + B) / 3)) * damp,
      edge, lc, vig: (corners - center) / Math.max(0.08, center) };
  }

  /* Estadístiques -> ajustos. Els "valors neutres" són el que fa una foto sense retocar, i s'amorteix perquè una foto acabada no és un
     encert exacte de l'edició. */
  function toAdjust(a) {
    const adj = L.zero(), D = 0.85;
    if (a.chroma < 0.03 || a.sat < 0.06) {            // blanc i negre
      adj.saturation = -1;
    } else {
      adj.saturation = clamp((a.sat - 0.40) / 0.30, -0.9, 0.9) * D;
      adj.warmth = clamp(a.warm / 0.55, -0.8, 0.8) * D;
      adj.tint = clamp(-a.tint / 0.10, -0.6, 0.6) * D * 0.7;
    }
    adj.brightness = clamp((a.mean - 0.46) * 1.5, -0.6, 0.6) * D;
    adj.contrast = clamp((a.sd - 0.24) / 0.15, -0.7, 0.8) * D;
    adj.highlights = clamp((a.p95 - 0.90) * 3.2, -0.6, 0.3) * D;
    adj.shadows = clamp((a.p5 - 0.07) * 3.5, -0.4, 0.7) * D;
    adj.ambience = clamp((a.lc - 0.075) / 0.07, -0.5, 0.7) * 0.8 * D;
    adj.sharpen = clamp((a.edge - 0.014) / 0.03, 0, 1) * 0.55;
    adj.vignette = a.vig > 0.12 ? -clamp((a.vig - 0.12) / 0.5, 0, 0.7) * 0.7 : 0;
    Object.keys(adj).forEach((k) => (adj[k] = Math.abs(adj[k]) < 0.03 ? 0 : r3(adj[k])));
    return adj;
  }
  /* Etiquetes en llenguatge humà de l'estil trobat */
  function describe(adj, a) {
    const tags = [];
    if (adj.saturation === -1) tags.push(t('exBW'));
    else if (adj.saturation > 0.22) tags.push(t('exVivid')); else if (adj.saturation < -0.22) tags.push(t('exMuted'));
    if (adj.warmth > 0.18) tags.push(t('exWarm')); else if (adj.warmth < -0.18) tags.push(t('exCool'));
    if (adj.contrast > 0.22) tags.push(t('exContrastHi')); else if (adj.contrast < -0.2) tags.push(t('exContrastLo'));
    if (adj.brightness > 0.2) tags.push(t('exBright')); else if (adj.brightness < -0.2) tags.push(t('exDark'));
    if (adj.vignette < -0.15) tags.push(t('exVignette'));
    if (adj.shadows > 0.3 && a.p5 > 0.1) tags.push(t('exFaded'));
    return tags.slice(0, 3).join(' · ') || t('exNeutral');
  }
  const scaled = (adj, f) => { const o = L.zero(); Object.keys(adj).forEach((k) => (o[k] = k === 'sharpen' ? clamp(adj[k] * f, 0, 1) : clamp(adj[k] * f, -1, 1))); return o; };

  async function read(file) {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { const u = URL.createObjectURL(file), im = new Image(); im.src = u; await im.decode(); bmp = im; setTimeout(() => URL.revokeObjectURL(u), 4000); }
    const bw = bmp.width || bmp.naturalWidth, bh = bmp.height || bmp.naturalHeight, k = Math.min(1, 256 / Math.max(bw, bh));
    const w = Math.max(8, Math.round(bw * k)), h = Math.max(8, Math.round(bh * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(bmp, 0, 0, w, h);
    const th = document.createElement('canvas'); th.width = th.height = 112; const tx = th.getContext('2d');
    const kk = Math.max(112 / bw, 112 / bh); tx.drawImage(bmp, (112 - bw * kk) / 2, (112 - bh * kk) / 2, bw * kk, bh * kk);
    if (bmp.close) bmp.close();
    return { stats: analyse(x.getImageData(0, 0, w, h).data, w, h), thumb: th.toDataURL('image/jpeg', 0.75) };
  }
  L.extractStats = { analyse, toAdjust };   // (per a proves)

  /* ---------- Panell de previsualització ---------- */
  const dock = $('dock'), slider = $('exSlider');
  let st = null;   // { adj, base, name, name }
  function preview() {
    const f = +slider.value / 100; $('exVal').textContent = Math.round(f * 100) + '%';
    S.adj = scaled(st.adj, f); L.syncUI(); L.draw();
  }
  function paint() { const min = +slider.min, max = +slider.max, v = +slider.value; slider.style.setProperty('--s', '0%'); slider.style.setProperty('--e', ((v - min) / (max - min) * 100) + '%'); }
  function end() { L.lock = false; dock.classList.remove('ex'); $('extract').hidden = true; st = null; L.syncUI(); L.draw(); }
  function cancel() { if (!st) return; S.adj = st.base; end(); }
  async function applyIt(save) {
    if (!st) return;
    const f = +slider.value / 100, adj = scaled(st.adj, f), base = st.base, name = st.name;
    S.adj = base; end();
    L.applyAdjTo(L.cur, adj);
    if (save) {
      const r = await L.ask(t('newStyleTitle'), name, null, { noDate: true, nameLabel: 'styleName', placeholder: 'Cinema' });
      if (r) { await L.styles.add(r.name || name, adj, 'extracted'); L.toast(t('toastStyleSaved')); return; }
    }
    L.toast(t('toastExApplied'));
  }
  $('exCancel').addEventListener('click', cancel);
  $('exApply').addEventListener('click', () => applyIt(false));
  $('exSave').addEventListener('click', () => applyIt(true));
  slider.addEventListener('input', () => { paint(); if (st) preview(); });
  (function nudges() {   // fletxes de pas fi (mateix comportament que als ajustos)
    [['nudgeEL', -1], ['nudgeER', 1]].forEach(([id, d]) => {
      let t0 = 0, t1 = 0;
      const fire = () => { slider.value = clamp(+slider.value + d, 0, 150); slider.dispatchEvent(new Event('input')); };
      const stop = () => { clearTimeout(t0); clearInterval(t1); };
      $(id).addEventListener('pointerdown', (e) => { e.preventDefault(); fire(); t0 = setTimeout(() => { t1 = setInterval(fire, 55); }, 380); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $(id).addEventListener(ev, stop));
    });
  })();

  /* ---------- Entrada: tria de la foto de referència ---------- */
  async function fromFile(file) {
    if (!file || !(file.type || '').startsWith('image/')) { L.toast(t('toastErrOpen')); return; }
    let res;
    try { res = await read(file); } catch (e) { console.error(e); L.toast(t('toastExBad')); return; }
    const adj = toAdjust(res.stats), name = (file.name || '').replace(/\.[^.]+$/, '').slice(0, 40) || t('exName');
    if (!S.has) {            // sense foto oberta: no hi ha res a previsualitzar -> es desa directament
      const r = await L.ask(t('newStyleTitle'), name, null, { noDate: true, nameLabel: 'styleName', placeholder: 'Cinema' });
      if (r && L.styles) { await L.styles.add(r.name || name, adj, 'extracted'); L.toast(t('toastStyleSaved') + ' · ' + describe(adj, res.stats)); }
      return;
    }
    if (L.home) L.home.close(); if (L.library) L.library.close();
    if (S.mode === 'crop') L.setMode('adjust');
    st = { adj, base: S.adj, name };
    $('exRef').src = res.thumb; $('exSub').textContent = describe(adj, res.stats);
    slider.value = 100; paint();
    L.lock = true; dock.classList.add('ex'); $('extract').hidden = false;
    preview();
  }
  L.extractFromFile = fromFile;
  $('refIn').addEventListener('change', () => { const f = $('refIn').files[0]; $('refIn').value = ''; fromFile(f); });
})();

</script>
<script>/* js/home.js */
/* Lumen — pantalla d'inici: continua, accions ràpides, darreres carpetes i estils. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const L = window.L, t = L.t, home = $('home');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const svg = (n) => '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const fmtDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : ''; };
  const nPhotos = (n) => (n === 1 ? t('photoN1') : t('photosN').replace('{n}', n));
  const recent = () => [...L.folders].sort((a, b) => (b.updated || 0) - (a.updated || 0));

  function render() {
    const h = new Date().getHours();
    $('homeHi').textContent = t(h < 6 ? 'hiNight' : h < 13 ? 'hiMorning' : h < 20 ? 'hiAfternoon' : 'hiNight');
    const act = L.activeFolder() || recent()[0];
    const c = $('homeCont');
    if (act && (act.count || L.items.length)) {
      c.hidden = false; c.dataset.id = act.id;
      $('homeContLabel').textContent = t('homeContinue');
      $('homeContName').textContent = act.name;
      $('homeContMeta').textContent = nPhotos(act.count || L.items.length) + (act.date ? ' · ' + fmtDate(act.date) : '');
      const img = $('homeCover'); img.hidden = !act.cover; if (act.cover) img.src = act.cover;
      c.classList.toggle('noimg', !act.cover);
    } else c.hidden = true;
    const rec = $('homeRecent'); rec.innerHTML = '';
    recent().slice(0, 8).forEach((f) => {
      const b = document.createElement('button'); b.className = 'hf'; b.dataset.id = f.id;
      b.innerHTML = '<span class="hcv">' + (f.cover ? '<img alt="" src="' + f.cover + '">' : svg('folder')) + '</span><span class="hn">' + esc(f.name) + '</span><span class="hm">' + esc(nPhotos(f.count || 0)) + '</span>';
      rec.appendChild(b);
    });
    $('homeRecentSec').hidden = !L.folders.length;
    const st = $('homeStyles'); st.innerHTML = '';
    const mine = L.styles ? L.styles.mine() : [];
    if (!mine.length) st.innerHTML = '<p class="hempty">' + esc(t('homeNoStyles')) + '</p>';
    mine.forEach((s) => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.id = s.id; b.innerHTML = svg('wand-sparkles') + '<span>' + esc(s.name) + '</span>'; st.appendChild(b); });
  }
  function open() { render(); home.hidden = false; home.classList.remove('in'); void home.offsetWidth; home.classList.add('in'); }
  function close() { home.hidden = true; }
  L.home = { open, close };

  $('homeCont').addEventListener('click', async () => {
    const id = +$('homeCont').dataset.id;
    if (L.activeFolder() && L.activeFolder().id === id) close(); else { await L.openFolder(id); close(); }
  });
  $('homeRecent').addEventListener('click', async (e) => {
    const b = e.target.closest('.hf'); if (!b) return;
    const id = +b.dataset.id;
    if (!(L.activeFolder() && L.activeFolder().id === id)) await L.openFolder(id);
    close();
  });
  $('homeStyles').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    close(); if (L.items.length && L.styles) { L.setMode('styles'); L.styles.choose(b.dataset.id); }
  });
  $('homeAll').addEventListener('click', () => L.library.open());
  $('qaPhotos').addEventListener('click', () => { $('fileIn').click(); });
  $('qaNew').addEventListener('click', () => L.library.newFolder());
  $('qaImport').addEventListener('click', () => $('dirIn').click());
  $('qaStyle').addEventListener('click', () => $('refIn').click());
  $('libHome').addEventListener('click', () => { L.library.close(); open(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !home.hidden && $('dlg').hidden) close(); });
  if (L.styles) { const add = L.styles.add; L.styles.add = async (...a) => { const r = await add(...a); if (!home.hidden) render(); return r; }; }
  L.hooks.folder = ((prev) => () => { prev(); if (!home.hidden) render(); })(L.hooks.folder);
})();

</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
